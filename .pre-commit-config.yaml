# mere/design_docs/mere_docs/implementation_strategy/2026-10-30_house_style_plan.md
# The same set as Graphshell's (engine split D120): line ceiling, responsa, workspace clippy
# and cargo deny, shaped as graphshell.git's .pre-commit-config.yaml.
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: line-ceiling
        language: rust
        types: [text]
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:line-ceiling-v0.0.2:line-ceiling"]
      - id: responsa-check
        name: responsa check
        entry: responsa check
        language: rust
        pass_filenames: false
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:responsa-v0.0.3:responsa"]
      - id: clippy
        name: clippy
        entry: cargo clippy --locked --workspace --all-targets
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$'
        pass_filenames: false
      # The app's query-views feature (mere-view's query feature) is off in the workspace
      # build; this is Graphshell's clippy-query hook for the app's half (engine split D120).
      - id: clippy-query
        name: clippy (query feature)
        entry: cargo clippy --locked --all-targets -p graphshell --features graphshell/query-views
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$'
        pass_filenames: false
      - id: dependency-bans
        name: dependency bans
        entry: cargo deny --locked check bans
        language: system
        pass_filenames: false
        always_run: true
