# house hooks --bans . --bans ports/graphshell/web --bans support/graphshell-coop/relay_server --patches --clippy-base '--workspace --all-targets' --clippy '--all-targets -p graphshell --features graphshell/query-views'
# Written by `house hooks` (eidetic, crates/house); `house hooks --check` fails when this file drifts from it.
# `house` is on the PATH: cargo install --git https://github.com/merely-made/eidetic house
fail_fast: true
default_install_hook_types: [pre-commit, post-commit, pre-push]
# Hooks without stages run at pre-commit only, so the notes push inside
# `house resolved push` reruns nothing but that hook.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: house line-ceiling
        language: system
        types: [text]
        always_run: true
      - id: decisions
        name: decisions check
        entry: house decisions check
        language: system
        pass_filenames: false
        always_run: true
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets
        language: system
        files: '(^|/)(Cargo\.toml|rust-toolchain\.toml|[^/]+\.rs)$'
        pass_filenames: false
      - id: clippy-2
        name: clippy --all-targets -p graphshell --features graphshell/query-views
        entry: cargo clippy --all-targets -p graphshell --features graphshell/query-views
        language: system
        files: '(^|/)(Cargo\.toml|rust-toolchain\.toml|[^/]+\.rs)$'
        pass_filenames: false
      - id: dependency-bans
        name: dependency bans
        entry: cargo deny --workspace --all-features check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-ports-graphshell-web
        name: dependency bans ports/graphshell/web
        entry: cargo deny --manifest-path ports/graphshell/web/Cargo.toml --workspace --all-features --config ports/graphshell/web/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-support-graphshell-coop-relay_server
        name: dependency bans support/graphshell-coop/relay_server
        entry: cargo deny --manifest-path support/graphshell-coop/relay_server/Cargo.toml --workspace --all-features --config support/graphshell-coop/relay_server/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: house-patches
        name: house patches
        entry: house patches --check
        language: system
        pass_filenames: false
        always_run: true
      # No Cargo.lock is tracked; what cargo resolved rides on each commit as a
      # git note under refs/notes/resolved (`house resolved show <commit>`).
      - id: record-resolved
        name: record resolved versions
        entry: house resolved record
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
      - id: push-resolved
        name: push resolved versions
        entry: house resolved push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
