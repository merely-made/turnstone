[workspace]

[package]
name = "turnstone"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A local-first browser for shared, addressable places, built on the Mere graph platform."
repository = "https://github.com/merely-made/turnstone"
keywords = ["browser", "peer-to-peer", "graph", "collaboration", "local-first"]
categories = ["gui"]

[[bin]]
name = "turnstone"
path = "src/main.rs"

[dependencies]
# The library this app is the reference host for: graph truth + the
# composition tier, consumed through the `mere` facade (kernel, canvas,
# forme, platen, glossary, ...). Git sibling per workspace convention; a
# local checkout is picked up via the gitignored `.cargo/config.toml`
# patches (mirrors mere's own sibling handling). Of the facade's twelve
# re-exports only two are compatibility scaffolding, `platen` and
# `workbench`: those move INTO this repo as the port proceeds. Canvas
# STAYS in mere (the 2026-07-09 amendment reversed its move); the crate
# was called `orrery` at turnstone's founding. Boundary pass plan, 2026-07-09.
mere = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Mere's graph-to-Scenograph adapter remains kernel-aware and product-owned.
# G3 consumes its existing score + scene lowering directly.
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The fetch actor (armillary + netfetcher/errand + the cookie jar): turnstone's
# web lane, consumed as an individual crate from mere's workspace while it
# still lives there — per the boundary pass, fetch is app-side material that
# moves into this repo with the port.
fetch = { package = "mere-fetch", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Session persistence: the flat single-session `graph.json` beside the data
# root (session_graph_store's blessed single-session shape). App-side
# material that moves here with the port, like fetch.
pandect = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Host-neutral semantic clip lowering. Knot still owns mutation and recorded
# provenance.
mere-import = { package = "import", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Denizen residency (participant gate B1): the authority gate over a denizen's
# nested chartulary graph, plus the substrate types the host speaks to it in.
servitor = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The profile's root identity: install is a delegation SIGNED by the user's
# personae master key (capability-model OQ2). The sealed vault implements the
# same IdentityProvider trait, so it swaps in without touching consumers.
identity = { package = "personae", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Self-signed Gemini client certificates projected from capsule-scoped
# Personae-derived Ed25519 keys. The private key stays transient.
rcgen = "0.14"
# Shared-place domains. Turnstone owns their worker composition while Gemot,
# Commons, Stickleback, and Muniment retain their own wire, authority, crypto,
# and durable-store contracts.
commons = { package = "commons-spine", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The live-lane carrier: ticket import, overlay tagging, and the sync parts
# the domain join helpers take. The place worker owns the handles; sessions
# are assembled by stickleback's JoinedSpace inside the domain crates.
transport = { package = "mere-transport", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The place worker's lane runtime: transport binding and JoinedSpace tasks
# need a reactor. Scoped to the worker thread; the app and panes stay sync.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
gemot = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
stickleback = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7", features = ["redb"] }
proofs = { package = "mere-proofs", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
codicil = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Denizen subjects are content-derived: blake3(source) is the 32-byte keyholder.
blake3 = "1"

# The portable projection score stored beside a Turnstone session. The app maps
# browser graph truth into it; Scenograph itself stays product-free.
sceno = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Graphshell's portable client/endpoint contracts and native receipt view.
# The committed Git sources are authoritative. The gitignored Cargo config
# redirects them to a sibling checkout during cross-repository development.
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The in-process carrier and the Knot endpoint it hosts. Turnstone embeds the
# endpoint rather than spawning it: a subprocess is unshippable in a browser
# tab or an iOS app, so the spawn path cannot be the only one.
graphshell-local = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
knot = { package = "knot-editor", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The reusable one-document product surface. This stays separate from the
# broad Knot port graph used by publishing and endpoint composition above.
knot-document = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The installed Distillery projection surface: the independent second provider
# proving the contributed-surface seam (Knot shared-surface plan P0).
distillery = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7", features = ["accesskit"] }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
graphshell-stdio = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The pane model (rung 5 slice C) is no longer a dependency at all: it folded
# into `src/panes` on 2026-07-25. One consumer wants no package, and the name
# `frisket` went to `cambium::frisket`, the shared pane frame this app consumes.
# The a11y/automation tree vocabulary (rung 5 slice F): UxTree + stitch +
# stable path-derived ids. Not facade-re-exported by mere (a named facade
# gap), so a direct git dep.
uxtree = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# Navigation vocabulary (the r3-owed Back/Forward/Reload): chrome's History
# is the cursor over visited addresses. Not facade-re-exported; direct dep
# like uxtree.
chrome = { package = "mere-chrome", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# AccessKit node vocabulary for the projection (matches mere's 0.24 pin).
accesskit = "0.24"
# 0.32 on purpose: genet-winit-host pins accesskit_windows 0.32, and two
# platform adapter stacks in one process is two UIA providers and one
# oversized PDB. Both ride the same core accesskit 0.24 either way.
accesskit_winit = "0.32"
# The actor-kernel runtime: the physics + fetch actors wake this shell's
# event loop through an `armillary::Wake`.
armillary = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The recycle bin (design_docs/2026-07-20_recycle_bin_athanor.md): the eidetic
# deleted-node bin behind an armillary actor. eidetic-fjall persists it at
# sessions/<id>/bin; pollster drives the store's async ops on the actor thread
# (serial disk IO wants no runtime).
eidetic = { package = "mere-eidetic", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
eidetic-fjall = { package = "mere-eidetic-fjall", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
# The omnibar's recall lane (mere's search surface wiring plan, W2): BM25 over
# the BrowsingTrace corpus the trail actor captures. Derived state — the index
# is re-minted from the corpus, never repaired.
eidetic-search = { package = "mere-eidetic-search", git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
pollster = "0.4"
# The per-user data root (`<data_dir>/turnstone`), TURNSTONE_ROOT-overridable for
# scratch profiles (the meerkat MERE_ROOT convention).
dirs = "6"
# Native file authority stays in the shell. The app only sees a typed effect
# and the contributed surface only sees the path the user selected.
rfd = "0.17.2"
# Render-free static-parse page extraction: the fetched body's `<title>`
# (and later description/OpenGraph) enriches the page's graph node.
# The engine contracts + the content lanes as session engines (session-engines
# plan phase 4: turnstone's content port spawns through the registry; the static
# lane's netfetch feature gives LocalFetcher its https branch).
inker = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-documents = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", features = ["netfetch", "livery", "reader", "smolweb"] }
# Protocol-faithful RSS/Atom parsing for the graph-native feed subscription
# loop. Gemini feed discovery remains gemtext-native in Turnstone; errand owns
# the shared XML grammar already used by Nematic.
errand = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# Optional app-control scripting. Piccolo is a Turnstone mod/workflow backend,
# not a browser-page engine; Vano/Boa remain the JavaScript lanes.
script-engine-api = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", optional = true }
script-engine-piccolo = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", optional = true }
# The app-core component host (mere): instantiates the envelope world and
# backs `emit` with turnstone's ring gate. Optional — the `wasm` feature.
app-host = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7", optional = true }
# Store limits for a component instance (the same wasmtime the host uses).
wasmtime = { version = "45", optional = true }
fleece = { version = "0.4.0", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# Turnstone owns pane retention and composition; Genet supplies the clean-room
# Livery cascade/Buckram layout state.
genet-livery = { version = "=0.0.2", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# The retained pane accessibility projection is owned beside Livery's
# fragments in Genet; Turnstone only namespaces and places the returned tree.
genet-render = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# The chrome layer's document substrate + name types + paint vocabulary
# (rung 3: the omnibar is turnstone's first DOM surface, composited above the
# canvas by the layered present).
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-probe = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
layout-dom-api = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
# Suggestion rows key node identity by the graph's stable UUIDs.
uuid = "1"
# Resolve a declared icon href (or the /favicon.ico fallback) against the page URL.
url = "2.5"
# Rasterize + composite the canvas Scene through the shared present stack.
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
genet-winit-host = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# The view toolkit (rung 5 slice D, the toolkit adoption): cambium (the xilem
# fork) + sprigging (its custom-paint leaves, incl. the data_grid and GraphCanvas
# a Roster grid and a Gloss minimap swatch need). Git dep on cambium.git so the
# gitignored local patch applies, like genet. Rung 3's hand-built ScriptedDom
# chrome migrates onto this over time; panes that need a grid or a paint leaf
# adopt it first.
cambium = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
cambium-winit = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# Authority-free source buffer plus Knot highlighting/outline/folds/preview.
# Storage, sync, grants, and keys stay in the endpoint process.
knot-editor-host = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
sprigging = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# The tile contract (rung 5 slice E): platen's split_beside_axis takes Genet's
# host-facing SplitAxis, so the edge-drop gesture names it. Already in the lock through
# platen; this names it (the supply plan's one-dep-line precedent).
genet-host-api = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# Chromium surface-engine adapter. `weld-engine` is the neutral inker bridge;
# the CEF runtime remains opt-in because it carries a bundled browser runtime.
weld-engine = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", optional = true }
# Pins match mere's workspace so the shared subtrees unify.
winit = "0.30.13"
# PNG encode for the scenario lane's GPU self-capture (composed-frame
# readback -> receipt).
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "webp"] }
# The dropped-sprite data-URI (file drop -> node face).
base64 = "0.22"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The pane model (src/panes) persists its layout, and `incipit` supplies the
# workspace ids its leaves carry. Both arrived with the folded frisket crate,
# which had carried them itself.
serde = { version = "1", features = ["derive"] }
incipit = { git = "https://github.com/merely-made/mere.git", rev = "96675412611142a223bcf8fd542c52b1ba3adfb7" }
serde_json = { version = "1", features = ["float_roundtrip"] }
# T5a's civil-day boundary is application policy. Jiff supplies civil types
# and IANA-zone rules needed to distinguish 23-, 24-, and 25-hour local dates.
jiff = "0.2"
# T5a is an acceptance consumer of this exact Turquet 0.13.0 source revision.
turquet = { version = "=0.13.0", git = "https://github.com/merely-made/turquet.git", rev = "bc3c454f755d0bfd70ab48bd9556a1cda2213d41" }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# The wasm denizen lane (participant gate B3): an `app-core` component acts
# through the action envelope, ring-gated per emission. Opt-in like piccolo
# so an ordinary browser build carries no wasm runtime.
wasm = ["dep:app-host", "dep:wasmtime"]
# Piccolo drives Turnstone's capability-scoped control scripts. It is kept
# opt-in so the browser host's ordinary build carries no scripting runtime.
piccolo = ["dep:script-engine-api", "dep:script-engine-piccolo"]
# Bundled Chromium in an accelerated OSR tile. Windows is the first Turnstone
# host because it has the live D3D12 shared-handle receipt; the feature stays
# compile-visible elsewhere but registers no platform producer there yet.
weld = ["dep:weld-engine", "dep:welding", "dep:grafting", "dep:windows"]

[target.'cfg(windows)'.dependencies]
# Weld owns CEF's callback-time copy; Grafting owns the generic DX12 shared
# handle import on Turnstone's existing wgpu device.
welding = { git = "https://github.com/merely-made/wgpu-weld.git", rev = "18395ed1043c93f215d0bca38361375681c6fc9c", features = ["cef-runtime"], optional = true }
grafting = { git = "https://github.com/merely-made/wgpu-graft.git", rev = "8106f7c6b16838eb9ec062f0293249b39c108907", default-features = false, features = ["wgpu-30"], optional = true }
windows = { version = "0.62", features = ["Win32_Foundation"], optional = true }

# Registry patches mirrored from mere's workspace manifest: a `[patch]` lives
# in the top-level manifest of whoever builds, so a standalone consumer of
# mere must restate them. Owned sources are pinned to immutable revisions or
# release tags; no local paths appear here, so a clean checkout compiles anywhere.
[patch.crates-io]
# No Stylo-family patch: Genet's live route is Livery/Buckram. The surviving
# `stylo_malloc_size_of` utility is independent and does not link a CSS engine.
#
# Published Cambium and Netrender crates still name these shared Genet seams by
# registry version. Keep a clean Turnstone consumer on the same Git type family
# as its direct Genet dependencies instead of resolving the retired registry
# paint/observable chain.
engine-observables-api = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-paint-types = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-livery = { version = "=0.0.2", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
layout-dom-api = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# The renderer family is published, but Turnstone also consumes its current git
# surface directly. Patch the full family together so Mere Canvas and the host
# cannot receive source-distinct `Scene` or paint vocabulary types.
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
netrender_text = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
#
# The published `mere-p2panda-net =0.7.2` owns the exact-ALPN net crate. Its
# seven sibling packages remain on the owned dalek-3 fork and move together at
# the matching immutable release tag. There is deliberately no `p2panda-net`
# patch: Turnstone consumes the renamed published package through Mere.
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.2" }
# Livery/Buckram require Genet's current taffy fork.
taffy = { package = "genet-taffy", version = "=0.13.1", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# Genet-Livery uses the current fork's last-line alignment and tab-size APIs.
# Root patches are not inherited, so a standalone host must select the same
# Parley package now exposed from the Genet workspace.
parley = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# ipc-channel: in-process fork vendored in genet (single-process default,
# unifies gpu-allocator's windows pin with wgpu-hal's).
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }

# Vello on wgpu 30. Upstream vello 0.10 still requires wgpu 29, so netrender
# (and through it this app's render path) takes vello from the owned fork:
# the v0.10.0 tag plus exactly the API changes in linebender/vello#1754.
# `[patch]` applies only from the top-level manifest and is NOT inherited
# from genet or netrender, so every app workspace restates it. Retires by
# deletion when upstream ships a wgpu-30 vello.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }

[profile.dev]
# line-tables-only, because full debug info no longer fits: the dependency
# graph crossed MSVC's program-database limit (LNK1140) the day the livery
# cutover landed, and a test binary that cannot link is worth more than local
# variables in a debugger. Backtraces keep file and line.
# debug = 0 outright, not even line tables: 16K PDB pages still overflowed
# under the VS 18 Insiders linker, and a red/green verdict does not need line
# numbers. Restore line-tables-only when the toolchain stops being a preview.
debug = 0
