[workspace]
# `sandbox_bootstrap_win` is the cdylib CEF's Windows sandbox bootstrap.exe
# loads (see design_docs/2026-08-03_turnstone_engine_adoption_plan.md,
# "E2-Weld Windows sandbox bootstrap"). It is a separate crate rather than a
# second crate-type on this package's own `[lib]`, which would give the
# cdylib and the `turnstone` `[[bin]]` the same output name and collide on
# `turnstone.pdb` in the shared target directory (cargo#6313).
#
# `ports/pelt` and `ports/tabard/desktop` are the Pelt and Tabard binaries, from Mere
# (engine split D36): their libraries are Graphshell's (`pelt-desktop`,
# `tabard-workshop`) or still Mere's (`pelt-core`).
members = [".", "sandbox_bootstrap_win", "ports/pelt", "ports/tabard/desktop",
    # The reference app from Mere (engine split D23, D104): Mere's subpaths kept.
    "ports/graphshell", "ports/graphshell/mere", "ports/graphshell/dramatis-pane",
    "ports/graphshell/blocks", "crates/graphshell/graphshell-mcp"]
exclude = ["vendor/mozjs-icu-collator", "vendor/mozjs-icu-normalizer",
    # Its own lock root (wasm32); the empty [workspace] in its manifest is what keeps it out.
    "ports/graphshell/web"]

[package]
rust-version = "1.97.1"
name = "turnstone"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A local-first browser for shared, addressable places, built on the Mere graph platform."
repository = "https://github.com/merely-made/turnstone"
keywords = ["browser", "peer-to-peer", "graph", "collaboration", "local-first"]
categories = ["gui"]

[[bin]]
name = "turnstone"
path = "src/main.rs"

[dependencies]
murm-sync = { version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main", optional = true }
async-trait = "=0.1.92"
# Product-redacted, bounded observations; the portable values live in Armillary.
apparatus-core = { version = "0.1.0", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false, features = ["serde"] }
# Presentable proof data/checks; Personae retains keys and issuing. The
# identity tier lives in merely-made/dramatis (dramatis repo plan, DR-D); every
# dramatis pin names the revision mere's workspace names, or personae splits.
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
athanor = { package = "mere-athanor", git = "https://github.com/merely-made/distillery.git", branch = "main", default-features = false, features = ["workshop-sealed", "workshop-destination"] }
tabard = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["native-host"] }
mandrake = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium-desktop = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium-rootstock = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }

# The library this app is the reference host for: graph truth and the
# composition tier, each consumed by the crate that owns it (engine split D58:
# the `mere` facade is dissolved). The kernel is `mere-kernel` (lib name
# `kernel`); the canvas is `pictograph::canvas`; forme, navigation, roster and
# trail are incipit's (`arrangement`/`graph`); `platen` and `workbench` are
# below. Git siblings per workspace convention; a local checkout is picked up
# via the gitignored `.cargo/config.toml` patches.
kernel = { package = "mere-kernel", git = "https://github.com/merely-made/mere.git", branch = "main" }
# `canvas` is the graph canvas; the default features (physics-engine,
# image-decode) are what the facade forwarded.
platen = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Mere's graph-to-Scenograph adapter remains kernel-aware and product-owned.
# G3 consumes its existing score + scene lowering directly.
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["canvas", "physics-engine", "image-decode"] }
# The fetch actor (armillary + netfetcher/errand + the cookie jar): turnstone's
# web lane, consumed as an individual crate from mere's workspace while it
# still lives there — per the boundary pass, fetch is app-side material that
# moves into this repo with the port.
fetch = { package = "mere-fetch", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Pelt's browsing controller and the sans-IO page load (SC, 2026-10-07): each
# node's document is a PeltContent, and each node's load is a PageLoad.
pelt-core = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["genet", "image-decode", "cue"] }
page-load = { package = "mere-pageload", git = "https://github.com/merely-made/inker.git", branch = "main" }
# Session persistence: the flat single-session `graph.json` beside the data
# root (session_graph_store's blessed single-session shape). App-side
# material that moves here with the port, like fetch.
pandect = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["furnace"] }
# Participant residency (participant gate B1): the authority gate over a participant's
# nested chartulary graph, plus the substrate types the host speaks to it in.
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# The profile's root identity: install is a delegation SIGNED by the user's
# personae master key (capability-model OQ2). Personae lends the key types and
# the IdentityProvider trait; the keys themselves stay in djinn, which
# Turnstone calls through Graphshell's custody route (dramatis DR-C).
identity = { package = "personae", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# Signing seeds from custody are transient and cleared on drop.
zeroize = "1"
# Self-signed Gemini client certificates projected from capsule-scoped
# Personae-derived Ed25519 keys. The private key stays transient.
rcgen = "0.14"
# Shared-place domains. Turnstone owns their worker composition while Gemot,
# Commons, Stickleback, and Muniment retain their own wire, authority, crypto,
# and durable-store contracts.
commons = { package = "commons-spine", git = "https://github.com/merely-made/gemot.git", branch = "main", optional = true }
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main", optional = true }
# The live-lane carrier: ticket import, overlay tagging, and the sync parts
# the domain join helpers take. The place worker owns the handles; sessions
# are assembled by Murm's JoinedSpace inside the domain crates.
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main", optional = true }
# The place worker's lane runtime: transport binding and JoinedSpace tasks
# need a reactor. Scoped to the worker thread; the app and panes stay sync.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main", optional = true }
# The knot:// release address grammar Turnstone and Knot share; no dependencies,
# so it is core rather than behind `authoring`.
gemot-address = { version = "0.1.0", git = "https://github.com/merely-made/gemot.git", branch = "main" }
# Clip editions: the release record at the revision the site library signs with.
gemot-site = { version = "0.1.0", git = "https://github.com/merely-made/gemot.git", branch = "main", optional = true }
# Mere's pure cooperative lifecycle report stays core. The captured-page
# projection is admitted only by `peers`; its cache remains app-owned below
# the shell-owned place worker.
moot-port = { package = "mere-moot", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main", optional = true }
muniment = { features = ["redb", "fjall"], git = "https://github.com/merely-made/eidetic.git", branch = "main" }
proofs = { package = "mere-proofs", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Participant subjects are content-derived: blake3(source) is the 32-byte keyholder.
blake3 = "1"

# The portable projection score stored beside a Turnstone session. The app maps
# browser graph truth into it; Scenograph itself stays product-free.
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The authored projection definition and source-binding types Knot authoring
# builds. Graphshell's `projection_editor` re-exported them until P3 (2026-10-15).
scenograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Graphshell's portable client/endpoint contracts and native receipt view.
# The committed Git sources are authoritative. The gitignored Cargo config
# redirects them to a sibling checkout during cross-repository development.
# Since Mere's stack lift P1 the application door (admission, the app client,
# custody and its clients, the identity views, `ResidentEndpointRoute`) is
# Djinn's `custody-client` feature below. The `graphshell` package is no
# longer named at all (the one repin round, 2026-10-15): its `view` receipts and
# `sessions` are `graphshell-host`'s, below; the `client` and `protocol`
# re-exports are named directly as `graphshell-client` and `chirograph`; P3 moved
# `projection_editor`'s reducer to `scenomise`, whose types were always
# `scenograph`'s. Since P4 the serving half (`admission::open_session`, the
# carriers, the native projection host and endpoint catalog) is
# `graphshell-host`.
# The serving half: admission, the carriers, dialling, the session loop with
# its notices, the endpoint catalog and the projection host (lift plan P4).
graphshell-host = { git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The in-process carrier and the Knot endpoint it hosts. Turnstone embeds the
# endpoint rather than spawning it: a subprocess is unshippable in a browser
# tab or an iOS app, so the spawn path cannot be the only one.
# Knot names Mere, Murm and Genet by `branch = "main"` at the canonical URL.
# The NetRender rows below match Genet's published immutable revision so the
# host and Canvas share one renderer identity. Repin the lock, then re-test.
# `peers`: the publish host, the iroh blob store behind clip evidence and the sync
# lane are the networked half of the library, off unless a host names them.
knot = { package = "knot-editor", git = "https://github.com/merely-made/knot-editor.git", branch = "main", default-features = false, optional = true }
knot-composition = { git = "https://github.com/merely-made/knot-editor.git", branch = "main" }
# The reusable one-document product surface. This stays separate from the
# broad Knot port graph used by publishing and endpoint composition above.
knot-document = { git = "https://github.com/merely-made/knot-editor.git", branch = "main", features = ["engine"] }
# The installed Distillery projection surface: the independent second provider
# proving the contributed-surface seam (Knot shared-surface plan P0).
distillery = { git = "https://github.com/merely-made/distillery.git", branch = "main", default-features = false, optional = true, features = ["inference-wire"] }
graphshell-client = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["local", "stdio"] }
# The projection door (broker client, offer, provider) left graphshell-endpoint for Mere.
graphshell-door = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["projection-door"] }
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main", features = ["native"] }
castellan-client = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["client"] }
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The pane model (rung 5 slice C) is no longer a dependency at all: it folded
# into `src/panes` on 2026-07-25. One consumer wants no package, and the name
# `frisket` went to `cambium::frisket`, the shared pane frame this app consumes.
# The a11y/automation tree vocabulary (rung 5 slice F): UxTree + stitch +
# stable path-derived ids. Not facade-re-exported by mere (a named facade
# gap), so a direct git dep.
uxtree = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["frozen"] }
# Navigation vocabulary (the r3-owed Back/Forward/Reload): backstep's History
# is the cursor over visited addresses (Mere dissolved chrome into it). Not
# facade-re-exported; direct dep like uxtree.
backstep = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# AccessKit node vocabulary for the projection (matches mere's 0.25 pin).
accesskit = "0.25"
# The actor-kernel runtime: the physics + fetch actors wake this shell's
# event loop through an `armillary::Wake`.
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
# The recycle bin (design_docs/2026-07-20_recycle_bin_athanor.md): the eidetic
# deleted-node bin behind an armillary actor. the Muniment Fjall backend persists it at
# sessions/<id>/bin; pollster drives the store's async ops on the actor thread
# (serial disk IO wants no runtime).
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# The omnibar's recall lane (mere's search surface wiring plan, W2): BM25 over
# the BrowsingTrace corpus the trail actor captures. Derived state — the index
# is re-minted from the corpus, never repaired.
eidetic-search = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
pollster = "1"
# The per-user data root (`<data_dir>/turnstone`), TURNSTONE_ROOT-overridable for
# scratch profiles (the meerkat MERE_ROOT convention).
dirs = "7"
# Native file authority stays in the shell. The app only sees a typed effect
# and the contributed surface only sees the path the user selected.
rfd = "0.17.2"
# Render-free static-parse page extraction: the fetched body's `<title>`
# (and later description/OpenGraph) enriches the page's graph node.
# The engine contracts + the content lanes as session engines (session-engines
# plan phase 4: turnstone's content port spawns through the registry; the static
# lane's netfetch feature gives LocalFetcher its https branch).
inker = { git = "https://github.com/merely-made/inker.git", branch = "main" }
genet-documents = { git = "https://github.com/merely-made/genet.git", branch = "main", features = ["livery"] }
# The Mere half of the former `genet-documents` (boundary plan P1): the
# reader and smolweb lanes, and the remote fetcher that supplies the http(s)
# schemes Genet's `LocalFetcher` no longer branches on. The two compose at
# `LocalFetcher::with_fallback`, which is the seam the split introduced.
mere-lanes = { git = "https://github.com/merely-made/inker.git", branch = "main", features = ["netfetch", "smolweb", "retained-clips"] }
# The source-preserving Micron native projection. Turnstone adapts
# its portable EngineDocument into the existing retained document session.
nematic = { git = "https://github.com/merely-made/inker.git", branch = "main" }
# Native Reticulum page transport.  The NomadNet adapter owns only the public
# destination and opaque page bytes; Turnstone owns navigation and rendering.
# Optional: Retinue carries Reticulum-licensed terms, so the `nomadnet` feature
# is the only way it enters a build.
retinue = { git = "https://github.com/merely-made/murm.git", branch = "main", optional = true }
# An ephemeral Reticulum client identity is generated per NomadNet page fetch;
# it is never persisted as a browsing preference or discovery record.
getrandom = "0.4"
# Protocol-faithful RSS/Atom parsing for the graph-native feed subscription
# loop. Gemini feed discovery remains gemtext-native in Turnstone; errand owns
# the shared XML grammar already used by Nematic.
errand = { git = "https://github.com/merely-made/errand.git", branch = "main" }
# Optional app-control scripting. Piccolo is a Turnstone mod/workflow backend,
# not a browser-page engine; Vano/Boa remain the JavaScript lanes.
script-engine-api = { git = "https://github.com/merely-made/genet.git", branch = "main", optional = true }
genet-didge = { git = "https://github.com/merely-made/genet.git", branch = "main", optional = true }
# The app-core component host (mere): instantiates the envelope world and
# backs `emit` with turnstone's ring gate. Optional — the `wasm` feature.
app-host = { git = "https://github.com/merely-made/graphshell.git", branch = "main", optional = true }
# Store limits for a component instance (the same wasmtime the host uses).
wasmtime = { version = "45", optional = true }
# Clip/capture capability, with lightweight Genet extraction reexported.
fleece = { package = "mere-fleece", git = "https://github.com/merely-made/inker.git", branch = "main", features = ["clip", "eidetic-bridge", "portable-clip"] }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Turnstone owns pane retention and composition; Genet supplies the clean-room
# Livery cascade/Buckram layout state.
# Portable Git/lock retain 0.0.3; explicit sibling mode also accepts tested 0.0.4.
genet-livery = { version = ">=0.0.3, <0.0.5", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The retained pane accessibility projection is owned beside Livery's
# fragments in Genet; Turnstone only namespaces and places the returned tree.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-render = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# The chrome layer's document substrate + name types + paint vocabulary
# (rung 3: the omnibar is turnstone's first DOM surface, composited above the
# canvas by the layered present).
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The shared clipboard service. The system backend lives behind the shell so
# neither the app nor the place worker ever holds a clipboard handle.
genet-clipboard = { git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
# Suggestion rows key node identity by the graph's stable UUIDs.
uuid = "1"
# Resolve a declared icon href (or the /favicon.ico fallback) against the page URL.
url = "2.5"
# Rasterize + composite the canvas Scene through the shared present stack.
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
genet-winit = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-presenter = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# The view toolkit (rung 5 slice D, the toolkit adoption): cambium (the xilem
# fork) + sprigging (its custom-paint leaves, incl. the data_grid and GraphCanvas
# a Roster grid and a Gloss minimap swatch need). Git dep on cambium.git so the
# gitignored local patch applies, like genet. Rung 3's hand-built ScriptedDom
# chrome migrates onto this over time; panes that need a grid or a paint leaf
# adopt it first.
cambium = { version = "0.6.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
registry = { package = "mere-registry", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["diagnostics"] }
cambium-winit = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
sprigging = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The application half of the former `genet-host-api`: the settings projection
# and the product-surface admission vocabulary. The boundary plan (P1) split
# that crate by authority; every one of turnstone's uses was this half, so the
# raw Genet remainder is no longer a dependency at all.
mere-surface-api = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The extracted split/tab contract. It now carries the tile seam turnstone
# names for splits and settings refs, and moved to mere with Cambium (P3).
workbench = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["serde"] }
# Chromium surface-engine adapter. `weld-engine` is the neutral inker bridge;
# the CEF runtime remains opt-in because it carries a bundled browser runtime.
weld-engine = { git = "https://github.com/merely-made/inker.git", branch = "main", features = ["welding-0-15"], optional = true }
# Pins match mere's workspace so the shared subtrees unify.
winit = "0.30.13"
# PNG encode for the scenario lane's GPU self-capture (composed-frame
# readback -> receipt).
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "webp"] }
# The dropped-sprite data-URI (file drop -> node face).
base64 = "0.23"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The pane model (src/panes) persists its layout, and `incipit` supplies the
# workspace ids its leaves carry. Both arrived with the folded frisket crate,
# which had carried them itself.
serde = { version = "1", features = ["derive"] }
# `view`: the scene's ViewIntent left pandect for incipit (Mere engine split D78).
incipit = { version = "0.2.2", git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["view", "graph"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# T5a's civil-day boundary is application policy. Jiff supplies civil types
# and IANA-zone rules needed to distinguish 23-, 24-, and 25-hour local dates.
jiff = "0.2"
# T5a is an acceptance consumer of this exact Turquet 0.13.0 source revision.
cleromancy-sky = { version = "0.1.0", git = "https://github.com/merely-made/cleromancy.git", branch = "main", optional = true }

# Atomic replacement of the local captured-search selection sidecar.
tempfile = "3"

# Redshank, the listening and annotation port incubated in woodshed. Turnstone
# is its second host (port plan Phase 7): it admits the port's own compact dock
# through the contributed-surface seam instead of copying one, and owns the ONE
# Firewheel/CPAL output authority the tile shares. Redshank's crates live in a
# NESTED workspace (`ports/redshank`), excluded from woodshed's root workspace;
# cargo's git source reads packages anywhere in the repo, so the path is a
# dependency detail, not a second source.
#
# The coordinated browser-family repin includes Redshank's current published
# board and presentation work while preserving its persistence/capture
# diagnostics, guarded note opens,
# exact cue seeks, listener capture settings, and
# the compact surface API. The gitignored `.cargo/config.toml` may redirect
# these four packages to the sibling checkout for the cross-repo edit loop, as
# it does for netrender and the wgpu family; a clean checkout resolves them
# from GitHub at this rev.
redshank-surfaces = { git = "https://github.com/merely-made/woodshed.git", branch = "main" }
redshank-model = { git = "https://github.com/merely-made/woodshed.git", branch = "main" }
# The one audio-device authority: Symphonia decode, a WSOLA retiming stage, and
# a Firewheel graph over CPAL. Owned by the app, shared by every episode tile.
redshank-playback = { git = "https://github.com/merely-made/woodshed.git", branch = "main", default-features = false }
# The listening model's crash-tolerant generation store, rooted under
# Turnstone's own session directory.
redshank-storage = { git = "https://github.com/merely-made/woodshed.git", branch = "main" }

# Shared browser controls and both presentation directions use Wgpu Cue main.
wgpu-cue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }

# The offscreen Servo host is reusable on macOS, Linux and Windows. The producer
# lives in wgpu-graft and is adapted by graft-engine's `servo` feature; the
# `grafting-servo` row only turns on its `servo` feature (graft-engine cannot
# forward it without dragging Servo into the inker lock). Servo's revision is
# wgpu-graft's alone.
graft-engine = { git = "https://github.com/merely-made/inker.git", branch = "main", optional = true }
grafting-servo = { git = "https://github.com/merely-made/wgpu-graft.git", branch = "main", default-features = false, features = ["wgpu-30", "servo"], optional = true }
grafting = { git = "https://github.com/merely-made/wgpu-graft.git", branch = "main", default-features = false, features = ["wgpu-30"], optional = true }

[dev-dependencies]
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main", features = ["estimated-probe-fixtures"] }
accesskit_consumer = "=0.39.1"
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
# Place fixtures select `peer-tests` for Mere's `test-identity` builder
# (vault lock ruling 97), without adding transport to ordinary test builds.
# The cookie custody test speaks the jar's own types. Same Genet revision as
# every other genet.git row here, so it adds no package to the graph.
netfetcher = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# The MCP adapter over a live mere route (engine split D82: its test moved from the resident).
graphshell-mcp = { path = "crates/graphshell/graphshell-mcp" }
mere-resident = { git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["test-fixtures"] }
mere-overmap = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# A parallel place suite outgrows the 1024 open files Linux allows by
# default; the tests raise their own soft limit. Already in the graph.
[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.189"

[features]
default = []
# Knot currently bundles the blob evidence store used by this adapter with its
# supplier `peers` feature. This does not install Turnstone's peer workers.
authoring = ["dep:knot", "knot/peers", "dep:gemot-site"]
peers = ["authoring", "graphshell-host/native", "dep:transport", "dep:commons", "dep:gemot", "moot-port/captured-web", "dep:stickleback", "dep:murm-sync", "dep:mien"]
place-reticulum = ["peers", "transport/reticulum", "transport/sync-lane"]
peer-tests = ["peers", "transport/test-identity"]
endpoint-process = ["authoring", "graphshell-host/native"]
inference = ["dep:distillery"]
workshop = ["athanor/workshop-worker", "athanor/workshop-destination", "athanor/workshop-native"]
sky = ["dep:cleromancy-sky"]
diagnostics = []
full-services = ["sky", "endpoint-process", "audio", "authoring", "peers", "inference", "workshop", "diagnostics"]
audio = ["redshank-playback/native"]
# NomadNet page and form requests over a Reticulum TCP interface. Off by
# default: Retinue's terms bar uses contributing to model training, so a build
# opts in by name. Without it `nomadnet::fetch_page` and `submit_form` answer
# with a typed refusal; address parsing and the Micron projection stay built.
nomadnet = ["dep:retinue"]
# The wasm participant lane (participant gate B3): an `app-core` component acts
# through the action envelope, ring-gated per emission. Opt-in like piccolo
# so an ordinary browser build carries no wasm runtime.
wasm = ["dep:app-host", "dep:wasmtime"]
# Piccolo drives Turnstone's capability-scoped control scripts. It is kept
# opt-in so the browser host's ordinary build carries no scripting runtime.
piccolo = ["dep:script-engine-api", "dep:genet-didge"]
# Bundled Chromium in an accelerated OSR tile. Windows is the first Turnstone
# host because it has the live D3D12 shared-handle receipt; the feature stays
# compile-visible elsewhere but registers no platform producer there yet.
weld = ["dep:weld-engine", "dep:welding", "dep:grafting", "dep:windows"]
# System WebView2 pages captured into the host's existing D3D12 device.
# Runtime construction and per-node profiles remain host-owned.
scry = ["dep:scrying-engine", "dep:windows", "dep:webview2-com"]
# Upstream Servo views share one named process profile and import through Graft
# on the existing host device. The shared receiving host also runs on Metal.
servo = ["dep:graft-engine", "graft-engine/servo", "dep:grafting-servo", "dep:grafting", "dep:windows"]

[target.'cfg(windows)'.dependencies]
# ANGLE EGL DLL selection is Windows-only; macOS uses Surfman CGL. The adapter
# forwards `no-wgl` to Servo, so no Servo row (or revision) lives here.
grafting-servo = { git = "https://github.com/merely-made/wgpu-graft.git", branch = "main", default-features = false, features = ["no-wgl"], optional = true }
scrying-engine = { git = "https://github.com/merely-made/inker.git", branch = "main", optional = true }
# Select a process crypto provider before Servo network construction.
webview2-com = { version = "=0.39.1", optional = true }
# Weld owns CEF's callback-time copy; Grafting owns the generic DX12 shared
# handle import on Turnstone's existing wgpu device.
welding = { version = "0.15.0", git = "https://github.com/merely-made/wgpu-weld.git", branch = "main", features = ["cef-runtime"], optional = true }
windows = { version = "0.62", features = ["Win32_Foundation"], optional = true }

# Registry patches mirrored from mere's workspace manifest: a `[patch]` lives
# in the top-level manifest of whoever builds, so a standalone consumer of
# mere must restate them. Owned sources are pinned to immutable revisions or
# release tags. The two vendored Mozilla ICU patches below are self-contained
# source copies, so a clean checkout does not require sibling paths.
[patch.crates-io]
# ureq 3.5.2 limits response bodies after decoding, so cef-dll-sys's build script cannot
# read CEF's 10.6 MiB index.json. Retire this patch when download-cef raises the limit.
download-cef = { path = "vendor/download-cef" }
# Of Mere's patch rows the reference app's graph uses light-file-dialog (engine split
# D123; cubek-matmul's row is dead since cubek 0.4). The patched copy left Mere with the
# resident and lives in graphshell.git's host/support/patches; cargo finds it there by
# package name.
# Reuse the Windows password class across cancellation and sequential prompts.
light-file-dialog = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The custody contract and resident use the same OS peer fact types.
peer-facts = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
genet-events = { git = "https://github.com/merely-made/genet.git", branch = "main" }
ostiary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
# Producer contracts use the same Mere source as the host.
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
incipit = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
mere-surface-api = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
workbench = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
hest = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
sprigging = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
script-wire = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
script-witgen = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Registry Webcue and native Genet sessions use the same document contract.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
esp = { git = "https://github.com/merely-made/distillery.git", branch = "main" }
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
fieldbook = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hodograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
quadstore = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
commons-spine = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
errand = { git = "https://github.com/merely-made/errand.git", branch = "main" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
gopher-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
guppy-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
misfin = { git = "https://github.com/merely-made/errand.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
nex-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Dramatis Gaz takes Muniment from the registry; keep its types on the same
# Mere source as Turnstone and the custody store.
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Genet and Mere share the maintained Classic 0.11 Vello
# shader family. Root patches are not inherited from Mere or Genet, so keep
# the renderer, encoding and shaders on the same immutable revision.
# SpiderMonkey's exact C API 2.1.2 release uses ICU ~2.1 internally. Its official
# published-source commit keeps those path dependencies in a separate Git
# family from Genet/Vano's required registry ICU >=2.2. No ICU Rust types cross
# that C-facing boundary; combined linking and native Intl remain required.
icu_capi = { git = "https://github.com/unicode-org/icu4x", rev = "30120d6a07fc5bb03a6c7647077bd2658b2559de", version = "=2.1.2" }
# Mozilla's unchanged private ICU source, with three production ranges widened
# to share Genet's registry ICU family. Provenance and qualification are recorded
# in Code/testing/turnstone/receipts/browser_family_20261007/icu-manifest-compat/
# (outside the repository).
mozjs_icu_collator = { path = "vendor/mozjs-icu-collator" }
mozjs_icu_normalizer = { path = "vendor/mozjs-icu-normalizer" }
# Match Distillery's stable Burn graph; root patches are not inherited.
gemini-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
# No Stylo-family patch: Genet's live route is Livery/Buckram. The surviving
# `stylo_malloc_size_of` utility is independent and does not link a CSS engine.
#
# Published Cambium and Netrender crates still name these shared Genet seams by
# registry version. Keep a clean Turnstone consumer on the same Git type family
# as its direct Genet dependencies instead of resolving the retired registry
# paint/observable chain.
engine-observables-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-paint-types = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-livery = { version = ">=0.0.3, <0.0.5", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The renderer family is published, but Turnstone also consumes its current git
# surface directly. Patch the four runtime crates together so Mere Canvas and
# the host cannot receive source-distinct `Scene` or paint vocabulary types.
# `netrender_text` is only Netrender's dev-only Parley adapter, so it does not
# reach this application graph and must not add an unused root patch.
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
#
# The tagged `mere-p2panda-net =0.7.5` source owns the exact-ALPN net crate.
# It resolves through this root patch until its crates.io release is available.
# Its selected sibling packages move together at the matching immutable tag.
# The inactive stream override is omitted: Cargo797e8a9bc serializes unused
# patch groups without sorting (cargo#17375). The selected tagged family stays.
# Livery/Buckram select published genet-taffy 0.16 directly; no Git patch
# is needed, so its source cannot depend on the parent Genet checkout.
# No parley/fontique patch rows: as of genet 5ae30cad the text forks are
# published as `genet-parley` and `genet-fontique` (lib names unchanged), so
# nothing in genet answers to the name `parley` and a patch row here would
# match no package and fail resolution. genet-livery reaches the fork by path
# inside the git checkout, so the last-line-alignment and tab-size APIs still
# resolve to the fork.

[profile.dev]
# line-tables-only, because full debug info no longer fits: the dependency
# graph crossed MSVC's program-database limit (LNK1140) the day the livery
# cutover landed, and a test binary that cannot link is worth more than local
# variables in a debugger. Backtraces keep file and line.
# debug = 0 outright, not even line tables: 16K PDB pages still overflowed
# under the VS 18 Insiders linker, and a red/green verdict does not need line
# numbers. Restore line-tables-only when the toolchain stops being a preview.
debug = 0

