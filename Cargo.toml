webrtc-carrier = { package = "murm-webrtc", version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
wgpu-cue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
workbench = { version = "=0.1.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }

# Compatibility source keys for immutable suppliers published before the
# repository rename. Targets and current direct dependencies use Murm.
[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-webrtc = { git = "https://github.com/merely-made/murm.git", branch = "main" }
retinue = { git = "https://github.com/merely-made/murm.git", branch = "main" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"

[[example]]
name = "cue_surfaces"
path = "examples/cue_surfaces.rs"
required-features = ["servo"]

# Suppliers that still name eidetic aa94fe22 (Gemot, Murm, Mere at the locked
# revision) follow the cohort: the www form of each URL is the same repository
# under another source key.
# Keep Knot's older ESP source on the same cohort as the Mere supplier.

# Keep actor and observation types coherent across retained older suppliers.esp-testkit = { git = "https://github.com/merely-made/distillery.git", branch = "main" }

# Graphshell's lint table (engine split D120): unsafe code and clippy::all warn too.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

# Unify immutable older Mere consumers with the qualified renderer family.
# Cargo requires a distinct source URL for a Git patch; all selected Classic
# packages below use the same commit and URL as the registry patches above.
# Hold the render stack at the revision this root already locks.

