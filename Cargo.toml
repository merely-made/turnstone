[workspace]
# `sandbox_bootstrap_win` is the cdylib CEF's Windows sandbox bootstrap.exe
# loads (see design_docs/2026-08-03_turnstone_engine_adoption_plan.md,
# "E2-Weld Windows sandbox bootstrap"). It is a separate crate rather than a
# second crate-type on this package's own `[lib]`, which would give the
# cdylib and the `turnstone` `[[bin]]` the same output name and collide on
# `turnstone.pdb` in the shared target directory (cargo#6313).
members = [".", "sandbox_bootstrap_win"]
exclude = ["vendor/mozjs-icu-collator", "vendor/mozjs-icu-normalizer"]

[package]
rust-version = "1.97.1"
name = "turnstone"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A local-first browser for shared, addressable places, built on the Mere graph platform."
repository = "https://github.com/merely-made/turnstone"
keywords = ["browser", "peer-to-peer", "graph", "collaboration", "local-first"]
categories = ["gui"]

[[bin]]
name = "turnstone"
path = "src/main.rs"

[dependencies]
# Product-redacted, bounded observations; no renderer dependency in the store.
apparatus = { package = "mere-apparatus", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", default-features = false, features = ["serde", "projection"] }
# Presentable proof data/checks; Personae retains keys and issuing. The
# identity tier lives in merely-made/dramatis (dramatis repo plan, DR-D); every
# dramatis pin names the revision mere's workspace names, or personae splits.
insigne = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391", features = ["verify"] }
athanor = { package = "mere-athanor", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
tabard = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
tabard-workshop = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["native-host"] }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
cambium-genet-winit-host = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }

# The library this app is the reference host for: graph truth + the
# composition tier, consumed through the `mere` facade (kernel, canvas,
# forme, platen, glossary, ...). Git sibling per workspace convention; a
# local checkout is picked up via the gitignored `.cargo/config.toml`
# patches (mirrors mere's own sibling handling). Of the facade's twelve
# re-exports only two are compatibility scaffolding, `platen` and
# `workbench`: those move INTO this repo as the port proceeds. Canvas
# STAYS in mere (the 2026-07-09 amendment reversed its move); the crate
# was called `orrery` at turnstone's founding. Boundary pass plan, 2026-07-09.
mere = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Mere's graph-to-Scenograph adapter remains kernel-aware and product-owned.
# G3 consumes its existing score + scene lowering directly.
cartography = { package = "mere-cartography", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The fetch actor (armillary + netfetcher/errand + the cookie jar): turnstone's
# web lane, consumed as an individual crate from mere's workspace while it
# still lives there — per the boundary pass, fetch is app-side material that
# moves into this repo with the port.
fetch = { package = "mere-fetch", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Pelt's browsing controller and the sans-IO page load (SC, 2026-10-07): each
# node's document is a PeltContent, and each node's load is a PageLoad.
pelt-core = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["genet", "image-decode"] }
page-load = { package = "mere-page-load", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Session persistence: the flat single-session `graph.json` beside the data
# root (session_graph_store's blessed single-session shape). App-side
# material that moves here with the port, like fetch.
pandect = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Participant residency (participant gate B1): the authority gate over a participant's
# nested chartulary graph, plus the substrate types the host speaks to it in.
servitor = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The profile's root identity: install is a delegation SIGNED by the user's
# personae master key (capability-model OQ2). Personae lends the key types and
# the IdentityProvider trait; the keys themselves stay in djinn, which
# Turnstone calls through Graphshell's custody route (dramatis DR-C).
identity = { package = "personae", git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
# Self-signed Gemini client certificates projected from capsule-scoped
# Personae-derived Ed25519 keys. The private key stays transient.
rcgen = "0.14"
# Shared-place domains. Turnstone owns their worker composition while Gemot,
# Commons, Stickleback, and Muniment retain their own wire, authority, crypto,
# and durable-store contracts.
commons = { package = "commons-spine", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The live-lane carrier: ticket import, overlay tagging, and the sync parts
# the domain join helpers take. The place worker owns the handles; sessions
# are assembled by stickleback's JoinedSpace inside the domain crates.
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", rev = "3d9e799fe06d2a58754569b8dc11b2dbc7d506e9" }
# The place worker's lane runtime: transport binding and JoinedSpace tasks
# need a reactor. Scoped to the worker thread; the app and panes stay sync.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
gemot = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Optional Mere port surface enabled only for the captured-page projection.
# Turnstone keeps the resulting cache in app-owned vocabulary below the
# shell-owned place worker.
moot-port = { package = "mere-moot", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["captured-web"] }
stickleback = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["redb", "fjall"] }
proofs = { package = "mere-proofs", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
chartulary = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Participant subjects are content-derived: blake3(source) is the 32-byte keyholder.
blake3 = "1"

# The portable projection score stored beside a Turnstone session. The app maps
# browser graph truth into it; Scenograph itself stays product-free.
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The authored projection definition and source-binding types Knot authoring
# builds. Graphshell's `projection_editor` re-exported them until P3 (2026-10-15).
scenograph = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Graphshell's portable client/endpoint contracts and native receipt view.
# The committed Git sources are authoritative. The gitignored Cargo config
# redirects them to a sibling checkout during cross-repository development.
# Since Mere's stack lift P1 the application door (admission, the app client,
# custody and its clients, the identity views, `ResidentEndpointRoute`) is
# `graphshell-endpoint`'s `door` feature below. This package remains for the
# serving half only: `admission::open_session`, the carriers, `sessions`,
# `view` and the native projection host and endpoint catalog, until
# `graphshell-host` exists (lift plan P4). P3 moved `projection_editor`'s
# reducer to `scenomise`; its types were always `scenograph`'s.
graphshell = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
notochord = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
# The in-process carrier and the Knot endpoint it hosts. Turnstone embeds the
# endpoint rather than spawning it: a subprocess is unshippable in a browser
# tab or an iOS app, so the spawn path cannot be the only one.
# Knot a27911a takes the application door from `graphshell-endpoint` and names
# Mere through the www alias at 19573b51, so every Mere row here names that
# same revision: the alias table below cannot redirect a www source onto
# itself, and one Mere source identity is the invariant.
# On 2026-10-15 Knot moves to c487a7c, which repins Knot onto Mere e92572a4 for
# the lift plan's P2 and P3, and every Mere row here moves with it.
# On 2026-10-15 Knot moves to 6e3e740 (the overmap tier) on Mere 2d6d81804,
# and every Mere row here moves with it again.
# Then Knot c1427d2 on Mere 2222917f3, and every Mere row with it.
# Then Knot 451ae24 on Mere 3847ec491, and every Mere row with it.
knot = { package = "knot-editor", git = "https://github.com/merely-made/knot-editor.git", rev = "451ae2444b5f55bee25777738f1ef028629a630a" }
# The reusable one-document product surface. This stays separate from the
# broad Knot port graph used by publishing and endpoint composition above.
knot-document = { git = "https://github.com/merely-made/knot-editor.git", rev = "451ae2444b5f55bee25777738f1ef028629a630a" }
# The installed Distillery projection surface: the independent second provider
# proving the contributed-surface seam (Knot shared-surface plan P0).
distillery = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
graphshell-client = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["accesskit"] }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["door", "local", "stdio"] }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The pane model (rung 5 slice C) is no longer a dependency at all: it folded
# into `src/panes` on 2026-07-25. One consumer wants no package, and the name
# `frisket` went to `cambium::frisket`, the shared pane frame this app consumes.
# The a11y/automation tree vocabulary (rung 5 slice F): UxTree + stitch +
# stable path-derived ids. Not facade-re-exported by mere (a named facade
# gap), so a direct git dep.
uxtree = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Navigation vocabulary (the r3-owed Back/Forward/Reload): chrome's History
# is the cursor over visited addresses. Not facade-re-exported; direct dep
# like uxtree.
chrome = { package = "mere-chrome", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# AccessKit node vocabulary for the projection (matches mere's 0.24 pin).
accesskit = "0.24"
# The actor-kernel runtime: the physics + fetch actors wake this shell's
# event loop through an `armillary::Wake`.
armillary = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The recycle bin (design_docs/2026-07-20_recycle_bin_athanor.md): the eidetic
# deleted-node bin behind an armillary actor. the Muniment Fjall backend persists it at
# sessions/<id>/bin; pollster drives the store's async ops on the actor thread
# (serial disk IO wants no runtime).
eidetic = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The omnibar's recall lane (mere's search surface wiring plan, W2): BM25 over
# the BrowsingTrace corpus the trail actor captures. Derived state — the index
# is re-minted from the corpus, never repaired.
eidetic-search = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
pollster = "0.4"
# The per-user data root (`<data_dir>/turnstone`), TURNSTONE_ROOT-overridable for
# scratch profiles (the meerkat MERE_ROOT convention).
dirs = "6"
# Native file authority stays in the shell. The app only sees a typed effect
# and the contributed surface only sees the path the user selected.
rfd = "0.17.2"
# Render-free static-parse page extraction: the fetched body's `<title>`
# (and later description/OpenGraph) enriches the page's graph node.
# The engine contracts + the content lanes as session engines (session-engines
# plan phase 4: turnstone's content port spawns through the registry; the static
# lane's netfetch feature gives LocalFetcher its https branch).
inker = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
genet-documents = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1", features = ["livery"] }
# The Mere half of the former `genet-documents` (boundary plan P1): the
# reader and smolweb lanes, and the remote fetcher that supplies the http(s)
# schemes Genet's `LocalFetcher` no longer branches on. The two compose at
# `LocalFetcher::with_fallback`, which is the seam the split introduced.
mere-document-lanes = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["netfetch", "smolweb", "retained-clips"] }
# The source-preserving Micron native projection. Turnstone adapts
# its portable EngineDocument into the existing retained document session.
nematic = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Native Reticulum page transport.  The NomadNet adapter owns only the public
# destination and opaque page bytes; Turnstone owns navigation and rendering.
retinue = { git = "https://github.com/merely-made/murm.git", rev = "3d9e799fe06d2a58754569b8dc11b2dbc7d506e9" }
# An ephemeral Reticulum client identity is generated per NomadNet page fetch;
# it is never persisted as a browsing preference or discovery record.
getrandom = "0.2"
# Protocol-faithful RSS/Atom parsing for the graph-native feed subscription
# loop. Gemini feed discovery remains gemtext-native in Turnstone; errand owns
# the shared XML grammar already used by Nematic.
errand = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Optional app-control scripting. Piccolo is a Turnstone mod/workflow backend,
# not a browser-page engine; Vano/Boa remain the JavaScript lanes.
script-engine-api = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1", optional = true }
script-engine-piccolo = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1", optional = true }
# The app-core component host (mere): instantiates the envelope world and
# backs `emit` with turnstone's ring gate. Optional — the `wasm` feature.
app-host = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", optional = true }
# Store limits for a component instance (the same wasmtime the host uses).
wasmtime = { version = "45", optional = true }
# Clip/capture capability, with lightweight Genet extraction reexported.
fleece = { package = "mere-fleece", git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["clip", "eidetic-bridge", "portable-clip"] }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# Turnstone owns pane retention and composition; Genet supplies the clean-room
# Livery cascade/Buckram layout state.
# Portable Git/lock retain 0.0.3; explicit sibling mode also accepts tested 0.0.4.
genet-livery = { version = ">=0.0.3, <0.0.5", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# The retained pane accessibility projection is owned beside Livery's
# fragments in Genet; Turnstone only namespaces and places the returned tree.
document-session-api = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-render = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# The chrome layer's document substrate + name types + paint vocabulary
# (rung 3: the omnibar is turnstone's first DOM surface, composited above the
# canvas by the layered present).
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# The shared clipboard service. The system backend lives behind the shell so
# neither the app nor the place worker ever holds a clipboard handle.
genet-clipboard = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
paint_list_api = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
paint_list_render = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
# Suggestion rows key node identity by the graph's stable UUIDs.
uuid = "1"
# Resolve a declared icon href (or the /favicon.ico fallback) against the page URL.
url = "2.5"
# Rasterize + composite the canvas Scene through the shared present stack.
netrender = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
genet-winit-host = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-render-host = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# The view toolkit (rung 5 slice D, the toolkit adoption): cambium (the xilem
# fork) + sprigging (its custom-paint leaves, incl. the data_grid and GraphCanvas
# a Roster grid and a Gloss minimap swatch need). Git dep on cambium.git so the
# gitignored local patch applies, like genet. Rung 3's hand-built ScriptedDom
# chrome migrates onto this over time; panes that need a grid or a paint leaf
# adopt it first.
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
cambium-winit = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Authority-free source buffer plus Knot highlighting/outline/folds/preview.
# Storage, sync, grants, and keys stay in the endpoint process.
knot-editor-host = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The application half of the former `genet-host-api`: the settings projection
# and the product-surface admission vocabulary. The boundary plan (P1) split
# that crate by authority; every one of turnstone's uses was this half, so the
# raw Genet remainder is no longer a dependency at all.
mere-surface-api = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The extracted split/tab contract. It now carries the tile seam turnstone
# names for splits and settings refs, and moved to mere with Cambium (P3).
workbench = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["serde"] }
# Chromium surface-engine adapter. `weld-engine` is the neutral inker bridge;
# the CEF runtime remains opt-in because it carries a bundled browser runtime.
weld-engine = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", features = ["welding-0-15"], optional = true }
# Pins match mere's workspace so the shared subtrees unify.
winit = "0.30.13"
# PNG encode for the scenario lane's GPU self-capture (composed-frame
# readback -> receipt).
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "webp"] }
# The dropped-sprite data-URI (file drop -> node face).
base64 = "0.22"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The pane model (src/panes) persists its layout, and `incipit` supplies the
# workspace ids its leaves carry. Both arrived with the folded frisket crate,
# which had carried them itself.
serde = { version = "1", features = ["derive"] }
incipit = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
serde_json = { version = "1", features = ["float_roundtrip"] }
# T5a's civil-day boundary is application policy. Jiff supplies civil types
# and IANA-zone rules needed to distinguish 23-, 24-, and 25-hour local dates.
jiff = "0.2"
# T5a is an acceptance consumer of this exact Turquet 0.13.0 source revision.
turquet = { version = "=0.13.0", git = "https://github.com/merely-made/turquet.git", rev = "bc3c454f755d0bfd70ab48bd9556a1cda2213d41" }

# Atomic replacement of the local captured-search selection sidecar.
tempfile = "3"

# Redshank, the listening and annotation port incubated in woodshed. Turnstone
# is its second host (port plan Phase 7): it admits the port's own compact dock
# through the contributed-surface seam instead of copying one, and owns the ONE
# Firewheel/CPAL output authority the tile shares. Redshank's crates live in a
# NESTED workspace (`ports/redshank`), excluded from woodshed's root workspace;
# cargo's git source reads packages anywhere in the repo, so the path is a
# dependency detail, not a second source.
#
# The coordinated browser-family repin includes Redshank's current published
# board and presentation work while preserving its persistence/capture
# diagnostics, guarded note opens,
# exact cue seeks, listener capture settings, and
# the compact surface API. The gitignored `.cargo/config.toml` may redirect
# these four packages to the sibling checkout for the cross-repo edit loop, as
# it does for netrender and the wgpu family; a clean checkout resolves them
# from GitHub at this rev.
redshank-surfaces = { git = "https://github.com/merely-made/woodshed.git", rev = "961731ace9ae9e687bdf8d40a032f2e1fbbf3321" }
redshank-model = { git = "https://github.com/merely-made/woodshed.git", rev = "961731ace9ae9e687bdf8d40a032f2e1fbbf3321" }
# The one audio-device authority: Symphonia decode, a WSOLA retiming stage, and
# a Firewheel graph over CPAL. Owned by the app, shared by every episode tile.
redshank-playback = { git = "https://github.com/merely-made/woodshed.git", rev = "961731ace9ae9e687bdf8d40a032f2e1fbbf3321" }
# The listening model's crash-tolerant generation store, rooted under
# Turnstone's own session directory.
redshank-storage = { git = "https://github.com/merely-made/woodshed.git", rev = "961731ace9ae9e687bdf8d40a032f2e1fbbf3321" }

[dev-dependencies]
accesskit_consumer = "=0.38.0"
accesskit-consumer-windows = { package = "accesskit_consumer", version = "=0.35.0" }
accesskit-consumer-unix = { package = "accesskit_consumer", version = "=0.36.0" }
mien = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# The place tests bind a transport from a fixture master; Mere gates that
# builder behind `test-identity` (vault lock ruling 97).
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", rev = "3d9e799fe06d2a58754569b8dc11b2dbc7d506e9", features = ["test-identity"] }
# The cookie custody test speaks the jar's own types. Same Genet revision as
# every other genet.git row here, so it adds no package to the graph.
netfetcher = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }

[features]
default = []
# The wasm participant lane (participant gate B3): an `app-core` component acts
# through the action envelope, ring-gated per emission. Opt-in like piccolo
# so an ordinary browser build carries no wasm runtime.
wasm = ["dep:app-host", "dep:wasmtime"]
# Piccolo drives Turnstone's capability-scoped control scripts. It is kept
# opt-in so the browser host's ordinary build carries no scripting runtime.
piccolo = ["dep:script-engine-api", "dep:script-engine-piccolo"]
# Bundled Chromium in an accelerated OSR tile. Windows is the first Turnstone
# host because it has the live D3D12 shared-handle receipt; the feature stays
# compile-visible elsewhere but registers no platform producer there yet.
weld = ["dep:weld-engine", "dep:welding", "dep:grafting", "dep:windows"]
# System WebView2 pages captured into the host's existing D3D12 device.
# Runtime construction and per-node profiles remain host-owned.
scry = ["dep:scrying-engine", "dep:windows", "dep:webview2-com"]
# Upstream Servo views share one named process profile and import through Graft
# on the existing host device. The first native host is Windows/D3D12.
servo = ["dep:graft-engine", "dep:servo", "dep:servo-wgpu-interop-adapter", "dep:grafting", "dep:windows", "dep:rustls"]

[target.'cfg(windows)'.dependencies]
scrying-engine = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", optional = true }
graft-engine = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6", optional = true }
servo = { git = "https://github.com/servo/servo", rev = "aac43a3f31a259f04a574f5ec4e959c943ad7cc7", features = ["no-wgl"], optional = true }
# Select a process crypto provider before Servo network construction.
rustls = { version = "0.23.37", features = ["aws_lc_rs"], optional = true }
servo-wgpu-interop-adapter = { git = "https://github.com/merely-made/wgpu-graft.git", rev = "bb48281bd4a88a726a009e0518706881b74b7604", default-features = false, features = ["wgpu-30", "servo"], optional = true }
webview2-com = { version = "=0.39.1", optional = true }
# Weld owns CEF's callback-time copy; Grafting owns the generic DX12 shared
# handle import on Turnstone's existing wgpu device.
welding = { git = "https://github.com/merely-made/wgpu-weld.git", rev = "c4dd593b7a730acb4aa6ffab0fe2edf8a0584083", features = ["cef-runtime"], optional = true }
grafting = { git = "https://github.com/merely-made/wgpu-graft.git", rev = "bb48281bd4a88a726a009e0518706881b74b7604", default-features = false, features = ["wgpu-30"], optional = true }
windows = { version = "0.62", features = ["Win32_Foundation"], optional = true }

# Registry patches mirrored from mere's workspace manifest: a `[patch]` lives
# in the top-level manifest of whoever builds, so a standalone consumer of
# mere must restate them. Owned sources are pinned to immutable revisions or
# release tags. The two vendored Mozilla ICU patches below are self-contained
# source copies, so a clean checkout does not require sibling paths.
[patch.crates-io]
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
mere-proofs = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Dramatis Gaz takes Muniment from the registry; keep its types on the same
# Mere source as Turnstone and the custody store.
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
# Genet and Mere share the maintained Classic 0.11 Vello
# shader family. Root patches are not inherited from Mere or Genet, so keep
# the renderer, encoding and shaders on the same immutable revision.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
# SpiderMonkey's exact C API 2.1.2 release uses ICU ~2.1 internally. Its official
# published-source commit keeps those path dependencies in a separate Git
# family from Genet/Vano's required registry ICU >=2.2. No ICU Rust types cross
# that C-facing boundary; combined linking and native Intl remain required.
icu_capi = { git = "https://github.com/unicode-org/icu4x", rev = "30120d6a07fc5bb03a6c7647077bd2658b2559de", version = "=2.1.2" }
# Mozilla's unchanged private ICU source, with three production ranges widened
# to share Genet's registry ICU family. Provenance and qualification are recorded
# in docs/receipts/browser_family_20261007/icu-manifest-compat/.
mozjs_icu_collator = { path = "vendor/mozjs-icu-collator" }
mozjs_icu_normalizer = { path = "vendor/mozjs-icu-normalizer" }
# Current published capture and WPE safety repairs; qualification is per platform.
scrying = { git = "https://github.com/merely-made/wgpu-scry.git", rev = "2c3ebd24118851cf6125cfb193f55aab20e3ad67" }
# Match Distillery's stable Burn graph; root patches are not inherited.
cubecl-runtime = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
burn-remote = { git = "https://www.github.com/merely-made/mere.git", rev = "3847ec491eca85a2b726dea97b3777f9164ba6f6" }
gemini-protocol = { git = "https://github.com/merely-made/smolweb.git", rev = "882baeb1b59bbdbb305e475f6675f69af997c4f4" }
# No Stylo-family patch: Genet's live route is Livery/Buckram. The surviving
# `stylo_malloc_size_of` utility is independent and does not link a CSS engine.
#
# Published Cambium and Netrender crates still name these shared Genet seams by
# registry version. Keep a clean Turnstone consumer on the same Git type family
# as its direct Genet dependencies instead of resolving the retired registry
# paint/observable chain.
engine-observables-api = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-paint-types = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-livery = { version = ">=0.0.3, <0.0.5", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# The renderer family is published, but Turnstone also consumes its current git
# surface directly. Patch the four runtime crates together so Mere Canvas and
# the host cannot receive source-distinct `Scene` or paint vocabulary types.
# `netrender_text` is only Netrender's dev-only Parley adapter, so it does not
# reach this application graph and must not add an unused root patch.
netrender = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
netrender_device = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
paint_list_api = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
paint_list_render = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
#
# The tagged `mere-p2panda-net =0.7.5` source owns the exact-ALPN net crate.
# It resolves through this root patch until its crates.io release is available.
# Its selected sibling packages move together at the matching immutable tag.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
# The inactive stream override is omitted: Cargo797e8a9bc serializes unused
# patch groups without sorting (cargo#17375). The selected tagged family stays.
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
# Livery/Buckram require Genet's current taffy fork.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# No parley/fontique patch rows: as of genet 5ae30cad the text forks are
# published as `genet-parley` and `genet-fontique` (lib names unchanged), so
# nothing in genet answers to the name `parley` and a patch row here would
# match no package and fail resolution. genet-livery reaches the fork by path
# inside the git checkout, so the last-line-alignment and tab-size APIs still
# resolve to the fork.
# ipc-channel: in-process fork vendored in genet (single-process default,
# unifies gpu-allocator's windows pin with wgpu-hal's).
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }

[profile.dev]
# line-tables-only, because full debug info no longer fits: the dependency
# graph crossed MSVC's program-database limit (LNK1140) the day the livery
# cutover landed, and a test binary that cannot link is worth more than local
# variables in a debugger. Backtraces keep file and line.
# debug = 0 outright, not even line tables: 16K PDB pages still overflowed
# under the VS 18 Insiders linker, and a red/green verdict does not need line
# numbers. Restore line-tables-only when the toolchain stops being a preview.
debug = 0

