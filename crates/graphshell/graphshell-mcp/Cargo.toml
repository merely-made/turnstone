[package]
rust-version = "1.97.1"
name = "graphshell-mcp"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A stdio Model Context Protocol server over an admitted Graphshell route: projections as resources, advertised intents through one stable tool."

[features]
default = []
# The `mere-mcp` binary: dials djinn's owner-only application door. The library
# serves any `chirograph::Carrier`, so it needs none of this.
door = ["dep:djinn", "dep:graphshell-endpoint"]

[[bin]]
name = "mere-mcp"
path = "src/bin/mere-mcp.rs"
required-features = ["door"]

[dependencies]
djinn = { workspace = true, optional = true, features = ["door-native"] }
chirograph.workspace = true
sceno.workspace = true
scenotime.workspace = true
serde_json.workspace = true
graphshell-endpoint = { workspace = true, optional = true, features = ["projection-door"] }
