# cargo-deny configuration for turnstone, the same as graphshell.git's (engine split D120).
#
#   cargo deny --workspace --all-features check -D unmatched-skip bans
#
# The hook runs that here and in each nested workspace that ships, each against
# its own deny.toml (`house hooks --bans`). A skip that matches nothing fails.
#
# Gated:
# - . (this workspace): turnstone, pelt, tabard and the reference app, every
#   member with every feature, on every target.
# - ports/graphshell/web: the Graphshell web page and viewer, a standalone
#   wasm32 workspace (its own deny.toml names the wasm32 target, the only one
#   it is built for).
# - support/graphshell-coop/relay_server: the co-op harness's relay
#   (design_docs/2026-11-11_coop_harness_plan.md), its own workspace.
# Exempt:
# - vendor/mozjs-icu-collator, vendor/mozjs-icu-normalizer: vendored trees,
#   excluded from this workspace and not workspaces of their own.
#
# One rule, the custody boundary (dramatis repo plan, rulings D4 and D16):
# castellan keeps every secret at rest and in hand. Its independently launched
# custodian links it; apps and workers call an authenticated custody route.
# The resident and the custodian may link it (the resident only through its
# in-process test feature, which this rule sees because every feature is on);
# Turnstone and the reference app may not.
#
# Duplicates are denied (Mark, 2026-11-12: "no duplicates. latest releases or an
# argument why"; 2026-11-13: "One version, latest version, no duplicates,
# unafraid to patch or fork if needed"). Two versions of one crate in a build
# are a defect: move the older version's holder forward. Each skip below is a
# duplicate that cannot be removed from here yet, naming the holder that keeps
# it ("latest" when that holder is at its newest release, "drops it" when a
# newer release of the holder already would, "still needs it" when the newer
# release does not, "family" for a family crate updated in its own repository),
# the path it arrives by, and what removes it. A holder that is our own
# manifest is updated, not skipped; a skip is a stopgap, never an end state.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"
deny = [
  { crate = "castellan", wrappers = ["mere-resident", "dramatis-resident", "djinn-custodian"], reason = "castellan is secret custody; the custodian and explicit in-process test hosts may link it; production resident/service graphs, applications and workers may not" },
]

