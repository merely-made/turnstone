[workspace]
resolver = "2"
members = [
    "crates/mere",
    "crates/canvas/cartography",
    "crates/canvas/pictograph",
    "crates/graph/graph-kernel",
    "crates/graph/linked-data",
    "crates/shell/chrome",
    "crates/shell/comms",
    "crates/incipit",
    "crates/system/pandect",
    "crates/system/fetch",
    "crates/system/page-load",
    "crates/system/framing",
    # The labelled state witness G8 and Isocosm share (F116 to F131).
    "crates/system/state-witness",
    "crates/system/source-edit",
    "crates/system/content-contract",
    "crates/system/shell-state",
    "crates/system/registry",
    "crates/system/tabard",
    "crates/distillery/alembic",
    "crates/system/ux-events",
    "crates/forme/curation",
    "crates/forme/forme",
    "crates/forme/uxtree",
    "crates/domain/apparatus",
    "crates/domain/personal-facts",
    "crates/domain/site",
    "crates/platen/platen",
    "crates/fleece",
    "crates/intel/eidetic-search",
    "crates/intel/mora-cmudict",
    "crates/intel/reference-data",
    # personae, insigne, gaz, chatelaine, notochord and the dramatis facade
    # left for their own repository on 2026-10-09 (dramatis repo plan, DR-D);
    # the persona picker stays until D7's condition is met.
    "crates/dramatis/persona-picker",
    "crates/mesh/mesh",
    "crates/script/rhai",
    "crates/script/document-host",
    "crates/script/app-host",
    # ─── Absorbed 2026-07-23 (design_docs/.../2026-07-23_repo_consolidation_plan.md) ───
    # Cambium and Conatus remain platform components. The 2026-10-19 foundation
    # promotion moved Eidetic, Armillary, ESP and Gemot to independent suppliers;
    # their crate identities and public APIs are unchanged.
    "crates/conatus/numen",
    "crates/conatus/seiche",
    "crates/conatus/nisus",
    "crates/conatus/modulus",
    "crates/conatus/conatus",
    # The lit body tenant over the reshaped kiss3d fork (wing rulings 471, 735).
    "crates/conatus/tenant",
    # The scene family sits under the Cambium umbrella (platform boundary plan
    # §1, P2): one family per crates/<family>/ directory, with the widget lane
    # and the scene lane sharing a home and keeping their state models apart.
    # The generic `scenograph` facade crate is gone; its solver registry moved
    # into `scenomise`. The published name now belongs to the host-neutral
    # projection authoring model, not a runtime facade.
    "crates/cambium/scenes/sceno",
    "crates/cambium/scenes/scenomise",
    "crates/cambium/scenes/scenotime",
    "crates/cambium/scenes/scenograph",
    "crates/chirograph",
    "crates/graphshell/graphshell-client",
    "crates/graphshell/graphshell-endpoint",
    "crates/graphshell/graphshell-host",
    "ports/graphshell",
    "ports/graphshell/mere",
    "ports/djinn",
    "ports/dramatis",
    "ports/djinn/castellan",
    "ports/distillery",
    "ports/moot",
    "ports/distillery/athanor",
    "ports/gazette",
    # Commissions and operates Retinue stations through Castellan. A member
    # since the p2panda 0.7.5 repin (device pairing plan, ruling 35).
    "ports/signalman",
    # ─── Landed 2026-09-03 from genet (design_docs/mere_docs/implementation_
    # strategy/2026-09-02_platform_boundary_and_repository_topology_plan.md,
    # the consumers-first half of P3) ───
    # Pelt is the reference-browser port. Tabard moved to `crates/system/`
    # on 2026-10-07 after becoming the shared theme library. The document lanes
    # are a content lane, not a widget, so they land in `crates/system/` beside
    # `fetch`. Package names are unchanged.
    # The Knot editor host moved to `crates/inker/knot-editor-host` on
    # 2026-09-04, when Knot's own sources left this repository (knot-editor
    # `design_docs/2026-09-01_knot_editor_repository_extraction_plan.md`, E2).
    # It is inker-family integration code, not Knot product source, so it
    # stays here; `ports/knot/` does not survive as a directory holding only
    # it.
    "ports/tabard/desktop",
    "ports/pelt",
    "ports/pelt/core",
    "ports/pelt/desktop",
    "crates/inker/knot-editor-host",
    "crates/system/document-lanes",
    # ─── Landed 2026-09-03 from genet (the same plan, P2) ───
    # The Cambium family: the retained widget lane. It keeps its own crate
    # names and versions; only its repository home moved. The scene lane lives
    # beside it under `crates/cambium/scenes/` (listed above with the other
    # absorbed families, because it has been mere's since 2026-07-23).
    "crates/cambium/cambium",
    "crates/cambium/cambium-rootstock",
    "crates/cambium/cambium-winit",
    "crates/cambium/cambium-winit-a11y",
    "crates/cambium/cambium-genet-winit-host",
    # Shared authoring surface; the standalone product is ports/tabard/desktop.
    "crates/cambium/tabard-workshop",
    "crates/cambium/cambium-genet-web-host",
    "crates/cambium/command-menu",
    "crates/cambium/hest",
    "crates/cambium/backstep",
    "crates/cambium/meristem",
    "crates/cambium/sprigging",
    # The scenario lane over a Cambium document host. Landed 2026-09-14 from
    # Isometry, where it was `wing-scenario`; the products switch to it next.
    "crates/cambium/mesquite",
    # Retained application chrome over Cambium, so it sits under the umbrella.
    "crates/cambium/workbench",
    # The mere view every application embeds (reservoir plan V2b).
    "crates/cambium/mere-view",
    # A mere route read remotely, filling the mere view (stack lift plan L14, R7).
    "crates/cambium/mere-overmap",
    # The application host contract genet's P1 split out of genet-host-api. A
    # host contract rather than a widget, so it lands beside `fetch`.
    "crates/system/surface-api",
    # The djinn test harness (djinn test harness plan, ruling 5): unpublished,
    # a path dev-dependency for djinn, castellan, personae and their siblings.
    "crates/system/djinn-testkit",
    # ─── Landed 2026-09-03 from genet (the same plan, P3) ───
    # The engine-management layer: inker selects and orchestrates content
    # engines, document-canvas lays its documents out, the three engine
    # adapters wrap a system WebView (scrying), a Servo embedding (graft) and
    # CEF (weld); the engine flip that carries one address between engines is
    # inker::flip (folded from verso-tile 2026-09-05). They keep their own
    # crate names and versions; only their repository home moved.
    "crates/inker/inker",
    "crates/inker/document-canvas",
    "crates/inker/engines/scrying-engine",
    "crates/inker/engines/graft-engine",
    "crates/inker/engines/weld-engine",
    # The smolweb rendering lane: nematic lowers the small-web formats into
    # inker's document model, illume lexes and highlights their text.
    "crates/nematic/nematic",
    "crates/nematic/illume",
    # Errand now owns the continuing Smolweb family in merely-made/errand.
    # Fetch consumes its independently versioned integration crate.
    # Tinct derives a palette from a few seed colours: a theming facility for
    # the widget lane, so it sits under the Cambium umbrella.
    "crates/cambium/tinct",
]
exclude = [
    "crates/cambium/hest-0_1",
    "crates/probes",
    # The unpublished browser host carries Git-only Genet presentation deps.
    # Keep it outside release resolution. NOTE: the entry below sits inside a
    # directory that is itself an explicit member (`ports/graphshell`), so
    # cargo never applies the exclusion and the line is documentation, not
    # mechanism. What actually keeps it out is the empty `[workspace]` table in
    # its own manifest, which is also what makes it buildable by
    # `--manifest-path`; and standing alone, it has to restate every `[patch]`
    # entry below that its graph needs.
    "ports/graphshell/web",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
# The scene crates inherit this; it matches what their own workspace
# declared before the 2026-07-23 absorption.
authors = ["Mark AB (markik)"]

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
# Seiche and numen are workspace-owned field/runtime components. The default
# field evaluation path stays portable; optional Burn/Rhai/Resident carriage is
# selected at the owning crate.
seiche = { version = "0.0.6", path = "crates/conatus/seiche" }
nisus = { version = "0.1.0", path = "crates/conatus/nisus" }
modulus = { version = "0.1.0", path = "crates/conatus/modulus" }
conatus = { path = "crates/conatus/conatus" }
cartography = { package = "mere-cartography", version = "0.0.2", path = "crates/canvas/cartography" }
linked-data = { package = "mere-linked-data", version = "0.0.1", path = "crates/graph/linked-data" }
kernel = { package = "mere-kernel", version = "0.0.2", path = "crates/graph/graph-kernel" }
# The graph-canvas content-root (was `orrery`; that name retired to the Merely
# product tier ladder, 2026-07-09 — see the boundary pass plan amendments).
pictograph = { version = "0.2.0", path = "crates/canvas/pictograph", default-features = false }
# The IconVG implementation pictograph encodes faces with (repos/emblem).
emblem = "0.2.0"
# Graph digest projections (djot outline, metrics) — `glossary` (was `mere-orrery`).

# The actor-kernel runtime (host-neutral): the !Send host-kernel boundary + the
# Send actor harness the constellation is built on. Promoted to its standalone
# repo (code-identical cutover 2026-07-09, boundary pass slice A); git sibling
# consumed one-way, local checkout via the gitignored `.cargo/config.toml` patch.
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
# The scenograph projection-engine family's core contract (scene snapshots,
# footprints, spaces, measurements) — git sibling consumed one-way, local
# checkout via the gitignored `.cargo/config.toml` patch. cartography emits
# sceno scenes (the P2 consumption slice; projection_proofs_plan).
sceno = { version = "0.0.6", path = "crates/cambium/scenes/sceno" }
scenomise = { version = "0.0.6", path = "crates/cambium/scenes/scenomise" }
scenotime = { version = "0.0.4", path = "crates/cambium/scenes/scenotime" }
scenograph = { version = "0.0.5", path = "crates/cambium/scenes/scenograph" }
# The remaining families absorbed 2026-07-23. Consumers keep using
# `<dep>.workspace = true`, so only this block knows where each one lives.
# The identity tier lives in merely-made/dramatis since DR-D (dramatis repo
# plan). Every entry names the SAME revision: two revisions are two sources,
# and two personae in one graph split its types. A sibling that embeds in
# this graph (Knot, through djinn) must pin the same revision too. Until
# dramatis is pushed, the gitignored `.cargo/config.toml` patches these to a
# local checkout.
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
chartulary = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", rev = "56601d9cb0c4901fd352bc789ce0ab53b5b6edd6" }
# The legend/memorial view over journals and codicils; reservation only.
hagiograph = { version = "0.0.1", git = "https://github.com/merely-made/eidetic.git", rev = "56601d9cb0c4901fd352bc789ce0ab53b5b6edd6" }
numen = { version = "0.2.0", path = "crates/conatus/numen" }
esp = { version = "0.1.0", git = "https://github.com/merely-made/esp.git", rev = "7955994686c07535417803d041a5aa95dd3ec4f1" }
# Fixture data is a dev-only supplier package; keep the runtime cohort unchanged.
esp-test-support = { version = "0.1.0", git = "https://github.com/merely-made/esp.git", rev = "7955994686c07535417803d041a5aa95dd3ec4f1" }
mora = "0.1.0"
mora-cmudict = { version = "0.0.1", path = "crates/intel/mora-cmudict" }
reference-data = { version = "0.0.1", path = "crates/intel/reference-data" }
# The projection contract, executed in duplicate (was graphshell-protocol;
# renamed 2026-08-14 because the contract is the family's, not the portal's).
chirograph = { version = "0.0.2", path = "crates/chirograph" }
# The card vocabulary chirograph re-exports and castellan wants without the wire.
graphshell-client = { version = "0.0.2", path = "crates/graphshell/graphshell-client" }
graphshell-endpoint = { version = "0.0.2", path = "crates/graphshell/graphshell-endpoint" }
# The serving half: admission, the session loop, the catalog and the projection
# host (Graphshell stack lift plan, L2, ruling R4). Default features off here;
# each consumer names the half it serves.
graphshell-host = { version = "0.0.2", path = "crates/graphshell/graphshell-host", default-features = false }
# Knot is an independent document product that Mere embeds rather than owns
# (knot-editor `design_docs/2026-09-01_knot_editor_repository_extraction_plan.md`).
# Its sources left this repository on 2026-09-04 under that plan's E2; Djinn and
# Turnstone consume one immutable revision. The `[patch]` table at the bottom of
# this file makes this checkout the implementation source for the Mere contracts
# Knot names, so those types keep one Cargo source identity. Standalone Knot
# pins Mere `ef0994ba` and Genet `2c7ef73b` on the qualified renderer family;
# embedded contracts resolve locally through the complete patch table below.
# The receipt records supplier graph and compile qualification. Djinn's `knot-site`
# row moves with these two pins so all Knot packages share one source.
# On 2026-10-15 both move to a27911ad, which imports custody and admission from
# `graphshell-endpoint`'s `door` (stack lift plan P1) and adds `mere_overlay`,
# Knot's overmap layer over a resident mere's route; Knot pins Mere 19573b51.
# On 2026-10-15 both move again to c487a7c, which repins Knot onto Mere
# e92572a4 for the lift plan's P2 and P3; Knot's sources are unchanged.
# On 2026-10-15 both move to 6e3e740, which shows the resident mere as the
# overmap tier on the catalog's canvas and repins Knot onto Mere 2d6d81804.
# Then to c1427d2: Knot on Mere 2222917f3 (picks, the "+N" setting,
# apply_and_lay_out and the native-run fixes), with the tier's native receipt.
# Then to 451ae24: Knot on Mere 3847ec491 (tier labels by name, exact cards).
# Then to b0feec9: Knot on Mere 71761a553 (the stack lift's P4: knot-editor's
# place projection test and k2 peer serve through `graphshell-host`) and on
# `backstep`, `edit-history`'s new name.
# Then to b19eebf: Knot on Mere 0c03dff3 (P5: the app-route receipt is
# Djinn's, `graphshell` is Knot's dev-dependency for `view` and `sessions`
# only) with merges carried from its overlay to the route.
# Then to fe9d98c: Knot on Mere 75a2e6ae and Murm fb6360c12b, the one repin round
# (remote mere route spec 7.3): sceno and scenomise 0.0.5, and `graphshell` is no
# longer named by Knot at all (its `view` and `sessions` are `graphshell-host`'s).
# Family source convention (2026-10-15): every first-party row names its repository
# by `branch = "main"` at the canonical URL; Cargo.lock pins the tested revision and
# a repin is `cargo update -p knot-editor`. See the family composition brief.
knot-editor = { version = "0.0.3", git = "https://github.com/merely-made/knot-editor.git", branch = "main" }
knot-document = { version = "0.0.1", git = "https://github.com/merely-made/knot-editor.git", branch = "main" }
# The credential-keeper port (dramatis plan D4). No longer a reservation:
# C1/C2 landed the OTP core, sealed OTP items, the release gate, and the
# `keeper` identity surface graphshell re-exports.
castellan = { version = "0.0.3", path = "ports/djinn/castellan" }
# The model-works port; first real consumer of the mesh host supervisor.
distillery = { version = "0.0.1", path = "ports/distillery" }
# The places port: one port, two surfaces (murmur = conversation, moot =
# community), composing gemot, commons, murm, and stickleback without owning
# their authority. Founding reservation, no implementation. Package is
# `mere-moot` because crates.io `moot` and `murmur` are both held elsewhere.
moot = { package = "mere-moot", version = "0.0.1", path = "ports/moot" }
# Distillery's shared recall-and-workshop library: memory levels behind
# `recall`, with the granted-agent workshop still reserved. Athanor is its
# first actor. Package is `mere-alembic`; crates.io `alembic` is the Linux
# Foundation VFX binding.
alembic = { package = "mere-alembic", version = "0.0.1", path = "crates/distillery/alembic" }
athanor = { package = "mere-athanor", version = "0.0.1", path = "ports/distillery/athanor" }
# Shared pins the graphshell crates inherit.
base64 = "0.22"
blake3 = "1"
mere = { path = "crates/mere" }

fetch = { package = "mere-fetch", version = "0.0.1", path = "crates/system/fetch" }
framing = { package = "mere-framing", version = "0.0.2", path = "crates/system/framing" }
page-load = { package = "mere-page-load", version = "0.0.1", path = "crates/system/page-load" }
content-contract = { path = "crates/system/content-contract" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", rev = "56601d9cb0c4901fd352bc789ce0ab53b5b6edd6" }
shell-state = { path = "crates/system/shell-state" }
incipit = { version = "0.2.0", path = "crates/incipit" }
chrome = { package = "mere-chrome", path = "crates/shell/chrome" }
comms = { package = "mere-comms", path = "crates/shell/comms" }
pandect = { version = "0.1.1", path = "crates/system/pandect" }
# Self-update over signed manifests (the cargo-packager-updater fork; ruled
# 2026-07-24: name luggage, home mere). Apps consume it via git dep like the
# rest of the family; mere itself will when its own packaging lands.
#
# `default-features = false` here is the release-identity core only. Cargo
# forbids a member turning a workspace dependency's defaults *off*, so the
# workspace declaration has to be the minimal common denominator and each
# member opts up. A member that wants the update pipeline writes
# `luggage = { workspace = true, features = ["native"] }`; forgetting to is a
# compile error naming the missing item, never a silently crippled updater.
# The crate's own `default = ["native"]` still serves consumers outside this
# workspace, which is who it is for.
luggage = { default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "56601d9cb0c4901fd352bc789ce0ab53b5b6edd6" }
ux-events = { path = "crates/system/ux-events" }
registry = { package = "mere-registry", path = "crates/system/registry", default-features = false }

# The engine-management family moved to genet 2026-07-10 (genet
# docs/2026-07-09_inker_genet_adoption_plan.md) and came back on 2026-09-03
# under the platform boundary plan's P3, this time as mere's own workspace
# members. Path deps now: none of the ten may appear in .cargo/config.toml's
# genet or crates-io patch tables, because patching a git or crates.io source
# at a path that is also a workspace member is a hard lockfile collision.
inker = { version = "0.1.1", path = "crates/inker/inker" }
document-canvas = { version = "0.1.0", path = "crates/inker/document-canvas" }
# `default-features = false` belongs on this declaration:
# `crates/inker/knot-editor-host` opts back into `html-fragment` explicitly, and
# so does the external knot-editor.
nematic = { version = "0.1.1", path = "crates/nematic/nematic", default-features = false }
fleece-extract = { package = "fleece", version = "0.5.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
fleece = { package = "mere-fleece", path = "crates/fleece", version = "0.0.1" }
genet-text = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
# Landed here from genet 2026-09-03 (platform boundary plan, P3): a workspace
# member now, so it is a path dep and must NOT appear in .cargo/config.toml's
# genet patch table — patching a git source at a path that is also a workspace
# member is a hard lockfile collision. `default-features = false` is kept
# because knot-document opts back into `preview` explicitly.
knot-editor-host = { version = "0.1.1", path = "crates/inker/knot-editor-host", default-features = false }
illume = { version = "0.0.3", path = "crates/nematic/illume" }
# ─── Landed from genet 2026-09-03 (platform boundary plan, P2) ──────────────
# Workspace members, so path deps. None of the eleven may appear in
# .cargo/config.toml's genet patch table: patching a git source at a path that
# is also a workspace member is a hard lockfile collision.
cambium = { version = "0.6.0", path = "crates/cambium/cambium" }
cambium-rootstock = { version = "0.1.0", path = "crates/cambium/cambium-rootstock", default-features = false }
mesquite = { version = "0.1.0", path = "crates/cambium/mesquite" }
cambium-winit = { version = "0.3.0", path = "crates/cambium/cambium-winit" }
cambium-winit-a11y = { version = "0.3.0", path = "crates/cambium/cambium-winit-a11y" }
cambium-genet-web-host = { version = "0.1.0", path = "crates/cambium/cambium-genet-web-host" }
command-menu = { version = "0.1.1", path = "crates/cambium/command-menu" }
hest = { version = "0.2.0", path = "crates/cambium/hest" }
backstep = { version = "0.1.0", path = "crates/cambium/backstep" }
meristem = { version = "0.2.0", path = "crates/cambium/meristem" }
sprigging = { version = "0.3.0", path = "crates/cambium/sprigging" }
# The three engine adapters, unpublished. Their version was genet's
# workspace 0.2.0, inlined on landing because mere's workspace version is
# 0.0.1 and the move is not a version decision.
scrying-engine = { version = "0.2.0", path = "crates/inker/engines/scrying-engine" }
graft-engine = { version = "0.2.0", path = "crates/inker/engines/graft-engine" }
weld-engine = { version = "0.2.0", path = "crates/inker/engines/weld-engine" }

# Centralized 2026-08-26. These were previously restated in each member with a
# full git spec, so a genet bump meant editing fifteen files and a missed one
# silently forked the lineage. Stated once here; members inherit with
# `foo.workspace = true` and add only their own features/optional flags.
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-livery = { version = "0.0.4", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
# Named genet-probe until genet 7baa554c (2026-09-14); same crate, new name.
