# cubecl-wgpu 0.10.0, vendored from the registry and moved to wgpu 30. This is
# the "narrow CubeCL backport" of the 2026-08-15 wgpu 30 unification: it is the
# ONLY crate in the burn 0.21 / cubecl 0.10 stack that names wgpu at all, so
# one vendored crate carries the whole resident lane across the major.
#
# The alternative was burn 0.22.0-pre.2 with cubecl 0.11.0-pre.2, which already
# require wgpu ^30. When this was written that was not resolvable, because
# cubecl-runtime 0.11 depends on cubecl-environment with the `cache` feature
# NON-optionally, pulling rusqlite 0.40 -> libsqlite3-sys ^0.38, while this
# graph also carried sqlx -> libsqlite3-sys <0.38. libsqlite3-sys sets
# `links = "sqlite3"`, so exactly one may exist in a graph.
#
# 2026-08-16: OUR HALF OF THAT CONFLICT IS GONE. sqlx and libsqlite3-sys are no
# longer in this workspace's graph at all. The note above misattributed the
# cause to p2panda-store's `groups`/`encryption` features; `cargo tree -e
# features` showed neither was ever enabled here. The real enablers were
# `p2panda-net/address_book`, which forced `p2panda-store/sqlite` outright, and
# `p2panda-store/default` arriving through p2panda-sync and p2panda-stream. The
# address book now runs on stickleback's muniment-backed store and every
# consumer opts out of the `sqlite` feature. See docs:
# 2026-08-16_address_book_muniment_port_plan.md.
#
# So this vendored crate is now retire-ABLE on the sqlite axis, but that has not
# been attempted: whether burn 0.22.0-pre.2 / cubecl 0.11.0-pre.2 resolve and
# behave here is the burn migration's question, not this patch entry's. See
# docs: 2026-08-09_burn_0_22_migration_plan.md.
# RETIRED 2026-08-20 with the burn 0.22 migration: cubecl-wgpu 0.11.0-pre.2
# from the registry already names wgpu 30, which is all the vendored backport
# existed to do. The vendored copy remains at support/patches/cubecl-wgpu for
# archaeology until a stable 0.22 lands, but it is no longer patched in.
# cubecl-wgpu = { path = "support/patches/cubecl-wgpu" }
# cubecl-runtime 0.11.0: the source is pristine upstream. The manifest
# removes persistence from default features (ruling 375), avoiding the Turso
# cache in Mere's defaults-disabled GPU graph. Remove when upstream makes
# persistence opt-in or fixes the defaults-on edge in cubecl-wgpu.
cubecl-runtime = { path = "support/patches/cubecl-runtime" }
# cubek-matmul 0.3.0: retain packed Q4 execution on 48-KiB workgroup devices
# by reducing unit stage partitions after register partitions reach one.
# Remove when upstream selection admits the same bounded packed-weight rows.
cubek-matmul = { path = "support/patches/cubek-matmul" }
# burn-cubecl 0.22.0-pre.4: the selector was retired under ruling 410 after
# the old pre.2 browser failure reproduced while upstream pre.4 passed all 21
# cases, plus nine unfused native launcher controls. Vendored patch source
# remains for provenance; current consumers select the registry crate.
# burn-remote 0.22.0: pump-observed targeted close and session receipts
# let owner reclaim stop one admitted lease without dropping the protocol.
# Remove when upstream provides equivalent control and passes the lifecycle
# receipt, including reclaim and recovery.
burn-remote = { path = "support/patches/burn-remote" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
# Livery/Buckram require Genet's Taffy fork. Genet's workspace patch is not
# inherited by consumers, so Mere restates the same immutable Genet revision.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a patch row here would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package (see [workspace.dependencies]).
# The upstream-20261013 compatibility tag keeps net =0.7.5 for the pinned
# Knot supplier while adopting current upstream. Net and its seven sibling
# packages share one immutable source; fork main also offers net 0.7.6.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }

# Genet's optional script-engine-boa owns its exact Boa Git revision directly.
# Registry overrides here would be unused and would not redirect that Git pin.

# Physics in dev builds (physics catalog plan, ruled 2026-10-04, "Opt 3 in dev
# for physics"): one Density start took 146.5 s at the dev profile's
# opt-level 0 and 6.0 s with these six crates at 3, the pictograph suite
# 102.5 s and 12.6 s, with the rebuild after a one-line seiche edit unchanged
# and backtraces keeping file and line. graphshell-web's own manifest names the
# same six.
[profile.dev.package.seiche]
opt-level = 3
[profile.dev.package.rapier2d]
opt-level = 3
[profile.dev.package.parry2d]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3

