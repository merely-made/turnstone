[package]
rust-version = "1.97.1"
name = "graphshell"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphshell presentation host and loopback acceptance view."
autobins = false

[[bin]]
name = "graphshell-alembic"
path = "src/bin/graphshell_alembic.rs"
required-features = ["alembic-workshop"]

[[example]]
name = "retained_content_fixture"
required-features = ["retained-content"]

[[example]]
name = "caller_owned_toolkits"
required-features = ["caller-owned-toolkit-bench"]

[[example]]
name = "projection_dynamics_receipt"
required-features = ["web", "physics-engine"]

[[test]]
name = "alembic_workshop_process"
required-features = ["alembic-workshop"]

[[test]]
name = "moot_resources"
required-features = ["moot-resources"]

[[test]]
name = "command_declarations"
required-features = ["web"]

[[test]]
name = "capture_conflict_fixture"
required-features = ["web"]

[[test]]
name = "moot_resources_reopen"
required-features = ["moot-resources"]

[features]
alembic-workshop = ["web", "dep:athanor", "athanor/workshop-destination", "athanor/workshop-worker", "athanor/workshop-sealed", "athanor/workshop-native", "muniment/directory", "dep:pollster", "dep:cambium-desktop", "dep:servitor", "dep:blake3"]
# Explicit synthetic/private receiving mode; normal public workshop startup does
# not connect to custody or automatically admit a real user's retained sources.
alembic-workshop-private = ["alembic-workshop", "graphshell-door/declaration", "dep:castellan-client", "castellan-client/client", "dep:eidetic"]
# One holder-owned graph with an explicitly invited guest.
coop = ["native", "web", "muniment/redb", "dep:pollster", "graphshell-client/pump"]
coop-window = ["coop", "dep:cambium-desktop", "dep:mien", "dep:genet-scripted-dom", "dep:layout_dom_api", "dep:image"]
editable-blocks = ["web", "dep:illume", "dep:vector-sheet", "dep:sprigging", "dep:ciborium", "dep:netrender", "dep:wgpu", "dep:uuid", "uuid/v4"]
query-views = ["web", "dep:mere-view", "mere-view/query", "dep:cambium"]
caller-owned-toolkit-bench = ["retained-content", "cambium-rootstock/embedding-egui", "cambium-rootstock/embedding-iced", "dep:image"]
# Goal-directed traversal over retained page text and the graph's links: the
# native goal surface (`goal_surface`). Lexical, model-free; reads, never fetches.
goal-surface = ["web", "dep:cambium", "dep:fleece", "fleece/retained-traversal", "dep:eidetic-search"]
# Opt-in model assessor (Eidetic S3 over ESP/Burn, CPU) for the goal surface on
# native hosts. Off by default and not part of any web build: the browser
# executor for the model is an open question. The model folder is local and
# never downloaded.
goal-surface-model = ["goal-surface", "dep:esp", "esp/goal-model", "esp/bert", "dep:sha2"]
# Finite headed native proof of the goal surface on the shared Cambium host.
goal-surface-proof = ["goal-surface", "dep:cambium-desktop", "dep:pollster", "dep:genet-scripted-dom", "dep:layout_dom_api", "dep:image"]
moot-resources = ["web", "webrtc-join", "dep:cambium", "dep:moot", "dep:gemot", "dep:eidetic", "dep:muniment"]
default = ["native", "image-decode", "document-layout", "retained-content", "physics-engine"]
# The canvas's and the board's force engine in this process. The browser
# viewer's main module leaves it off and runs physics in a Worker; every other
# host that names this crate without its defaults lists it.
physics-engine = ["mere?/physics-engine", "graphshell-host/physics-engine"]
# Document-capable hosts retain Platen's document producer. Activating this
# feature also activates the optional dependency before forwarding the feature.
document-layout = ["dep:platen", "platen/document-layout"]
# The retained workspace and its acknowledged editing lifecycle belong to
# product hosts, not the read-only browser viewer.
workspace-editor = ["web", "dep:platen", "dep:comms", "platen/workspace-editor", "scenograph/editor"]
# Retained document sessions belong to the application host, not the read-only
# graph viewer. Product web builds opt in explicitly; native defaults retain it.
retained-content = ["web", "document-layout", "dep:genet-presenter", "dep:cambium", "dep:fleece", "dep:wgpu", "dep:pelt-core", "pelt-core/cue", "dep:wgpu-cue", "dep:cue-netrender", "dep:inker", "dep:netrender", "dep:mere-lanes"]
# Forwards genet-livery's image decoding (mer3ly Ruling 111); on by default.
image-decode = ["cambium-rootstock?/image-decode", "mere?/image-decode", "pelt-core?/image-decode"]
# Existing admitted sessions, transports, Personae composition, and receipt
# binaries. This remains the default so current native callers keep working.
native = [
    "webrtc-join",
    "dep:blake3",
    "dep:ostiary",
    "graphshell-endpoint/projection",
    "graphshell-door/projection-door",
    "graphshell-door/declaration",
    "dep:castellan-client",
    "castellan-client/client",
    "graphshell-door/profile",
    "graphshell-endpoint/network",
    "graphshell-endpoint/stdio",
    "graphshell-host/native",
    "graphshell-host/custody-client",
    "dep:notochord",
    "dep:dramatis",
    "dep:chatelaine",
    "dep:personae",
    "personae/ssh",
    "dep:rand_core",
    "dep:serde",
    "dep:pandect",
    "dep:incipit",
    "dep:sporran",
    "dep:signature",
    "dep:ssh-agent-lib",
    "dep:ssh-key",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:transport",
    "dep:uuid",
    "dep:webrtc-carrier",
    "dep:zeroize",
]
# The live WebRTC lane: the join sequence over a real carrier and the pump
# that presents its frames as the session stream. Separate from `native`
# because it is what pulls str0m and the carrier's own tokio driver into the
# build — every native Graphshell that is not yet serving browser joins keeps
# not paying for them. The C4a fixture and its tests require this feature.
webrtc-session = ["native", "webrtc-join", "webrtc-carrier/native", "graphshell-host/webrtc-session"]

# The headed W1 fixture can serve Distillery's read-only Chronicle over the
# existing WebRTC door. It remains opt-in so the ordinary C4 live-board host
# does not acquire Distillery's product dependency cone.
distillery-chronicle-fixture = ["webrtc-session", "dep:distillery", "dep:mesh"]

# The joining side of the WebRTC door, buildable for `wasm32-unknown-unknown`:
# the peer sequence, the wire both sides share, and the door's client
# functions. No runtime, no transport, no carrier beyond its Wasm-clean core.
# `webrtc-session` implies it. A wasm build also needs
# `--cfg getrandom_backend="wasm_js"` in the target's rustflags — see
# personae's `Cargo.toml` (in merely-made/dramatis) for why that cannot live here.
# The browser's glue over the join: a `BrowserInitiator` as the join's frame
# channel and the NDJSON session over its frames. wasm32 only in effect — the
# carrier's `browser` adapter declares its JS bindings for that target alone,
# so enabling this natively activates nothing, and the module is gated to the
# target as well.
webrtc-browser = ["webrtc-join", "webrtc-carrier/browser"]

webrtc-join = [
    "graphshell-host/webrtc-join",
    "dep:getrandom",
    "dep:notochord",
    "dep:personae",
    "dep:serde",
    "dep:thiserror",
    "dep:webrtc-carrier",
]

# C4a's composition receipt: the join, admission, pump, serve loop and the
# event-driven client over one real loopback WebRTC pair. `required-features`
# rather than a cfg inside, so a default `cargo test` never reaches the file.

# The browser reference-host cone. H0 proves the dependency boundary; H1 adds
# the local Mere host adapter on top of this selected graph + canvas surface.
#
# Holds no browser API of its own. The wasm presenter that consumes this cone
# is the separate `graphshell-web` crate (`web/Cargo.toml`, whose `[lib] path`
# is `src/web.rs`), and it names its own JS bindings; the IndexedDB backend it
# stores through belongs to muniment, beside the redb and zip realizations.
# The web host's canvas and remote board stage repulsion on the page's GPU
# (physics catalog plan, P5c; mere `canvas-gpu`, ruled 2026-10-02).
canvas-gpu = ["web", "mere/canvas-gpu", "graphshell-host/board-gpu"]
web = [
    # The remote board the browser pages draw (stack lift plan, P10).
    "graphshell-host/board",
    # Promoted links name Cambium's link-member target; the web crate links
    # Cambium anyway, so the viewer pays nothing for it.
    "dep:cambium",
    "dep:hest",
    "dep:async-trait",
    # The canvas's producer semantics for a screen reader (`canvas_reader`;
    # dynamics grammar plan, F67).
    "dep:cambium-rootstock",
    "dep:chartulary",
    "dep:eidetic",
    "dep:mere",
    # The mere route's wire vocabulary `mere_host` serves (`mere-overmap`
    # without its view).
    "dep:mere-overmap",
    "dep:muniment",
    "dep:pandect",
    "dep:incipit",
    "dep:sporran",
    "dep:serde",
    "dep:sha2",
    "dep:uuid",
    "dep:url",
]
# A bounded app-core host dialect over a disclosed capsule collection. Pack
# verification is portable; the browser owns worker execution and its view.
applets = ["web", "eidetic/pack-signing", "dep:personae"]
# Native owner composition for admitted Moot resource readings. This does not
# enter the ordinary browser cone or install an application activity owner.
# Finite native owner-composition proof; ordinary consumers need no window or
# fixture dependencies. It installs neither peer services nor an activity owner.
moot-resource-proof = ["moot-resources", "dep:cambium-desktop", "dep:mien", "dep:proofs", "dep:servitor", "dep:tokio", "dep:pollster", "dep:genet-scripted-dom", "dep:layout_dom_api", "dep:image"]
# Native device-agent composition for H7 personal graph synchronization. The
# browser/PWA reaches this authority through its admitted device session.
personal-sync = [
    "native",
    "web",
    "muniment/redb",
    "pandect/personal-sync",
    "dep:p2panda-core",
    "dep:p2panda-store",
    "dep:stickleback",
    "dep:murm-sync",
]

[dependencies]
ostiary = { workspace = true, optional = true }
castellan-client = { workspace = true, optional = true }
athanor = { package = "mere-athanor", path = "../distillery/athanor", default-features = false, optional = true }
wgpu-cue = { workspace = true, optional = true }
cue-netrender = { workspace = true, optional = true }
vector-sheet = { workspace = true, optional = true }
ciborium = { version = "0.2", optional = true }
sprigging = { workspace = true, optional = true }
illume = { workspace = true, optional = true }
genet-presenter = { workspace = true, optional = true }
cambium = { workspace = true, optional = true }
moot = { package = "mere-moot", path = "../moot", features = ["resource-view", "presentation"], optional = true }
fleece = { workspace = true, features = ["portable-clip", "page-links"], optional = true }
eidetic-search = { workspace = true, optional = true }
esp = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pelt-core = { workspace = true, features = ["genet"], optional = true }
inker = { workspace = true, optional = true }
netrender = { workspace = true, optional = true }
mere-lanes = { workspace = true, features = ["retained-clips"], optional = true }
mere-view = { workspace = true, default-features = false, optional = true }
hest = { workspace = true, optional = true }
# A node that names a correspondent opens Comms (`comms_open`); the model alone, no adapters.
comms = { workspace = true, optional = true }
# The check conclusions and faults, named directly (insigne proofs plan, B).
insigne = { workspace = true, features = ["verify"] }
async-trait = { version = "0.1", optional = true }
cambium-rootstock = { workspace = true, optional = true }
base64.workspace = true
chartulary = { workspace = true, optional = true }
distillery = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
graphshell-client.workspace = true
graphshell-endpoint.workspace = true
# Mere's side of the protocol: the application door client and identity profile.
graphshell-door.workspace = true
# The serving half (stack lift plan, L2): admission, the session loop, the
# catalog and the projection host. `native` and the WebRTC features name its
# halves; with none, it is the fixture endpoints the web tests use.
graphshell-host = { version = "0.0.2", path = "../../crates/graphshell/graphshell-host", default-features = false }
chirograph.workspace = true
mere = { path = "../../crates/mere", default-features = false, features = ["graph", "canvas"], optional = true }
# The mere route's wire vocabulary (stack lift plan L14). The native viewer
# that hosts its route panel is the `graphshell-mere` package.
mere-overmap = { workspace = true, optional = true }
mesh = { workspace = true, optional = true }
muniment = { workspace = true, optional = true }
# The session core. MereHost's truth is a pandect GraphSession in the browser
# too, so it sits here rather than in the native-only table (reservoir plan
# §7 item 26).
pandect = { workspace = true, optional = true }
# The view state MereHost reads and writes through the session (engine split D78).
incipit = { workspace = true, features = ["view"], optional = true }
sporran = { workspace = true, optional = true }
platen = { path = "../../crates/platen/platen", default-features = false, optional = true }
scenograph.workspace = true
sceno.workspace = true
sceno-backdrops.workspace = true
scenomise = { workspace = true, features = ["authoring"] }
scenotime.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
chatelaine = { workspace = true, optional = true }
serde_json.workspace = true
workbench.workspace = true
tabard = { workspace = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v5"], optional = true }
url = { version = "2", optional = true }

# Wasm-clean, and declared here rather than in the native-only table below so
# the browser build can reach them: the identity core (`personae` without
# `agent`), Notochord's decision core, the carrier's Wasm-clean core, and the
# join's own two small deps. `rand_core` and `transport` stay native-only —
# one would drag a third `getrandom` major into the wasm graph, the other is
# iroh and tokio.
notochord = { workspace = true, features = ["tokio"], optional = true }
# Declared without `agent`: that feature is the ssh-agent lane (tokio,
# gethostname) and only the native cone wants it, so `native` enables it and a
# wasm feature enabling this dependency gets the identity core alone.
personae = { workspace = true, optional = true }
thiserror = { version = "1", optional = true }
# The join's nonces. See `webrtc_join`'s module doc for why not `rand_core`.
getrandom = { version = "0.3", optional = true }
webrtc-carrier = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
murm-sync = { workspace = true, optional = true }
cambium-desktop = { workspace = true, optional = true }
mien = { workspace = true, optional = true }
proofs = { workspace = true, optional = true }
servitor = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
genet-scripted-dom = { workspace = true, optional = true }
layout_dom_api = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
cambium = { workspace = true, optional = true }
moot = { package = "mere-moot", path = "../moot", features = ["resource-owner"], optional = true }
gemot = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
# The identity read model and intents (`identity`, `identity_projection`).
# Graphshell no longer links castellan (dramatis repo plan, D4, D15): its
# doors serve whatever `native::resident_identity::ResidentIdentity` djinn
# hands them, and applications reach custody through
# `graphshell_door::custody_client`.
dramatis = { workspace = true, optional = true }
p2panda-core = { package = "p2mere-core", version = "0.9", optional = true }
p2panda-store = { package = "p2mere-store", version = "0.9", default-features = false, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
signature = { version = "2", optional = true }
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.6", features = ["ed25519", "encryption"], optional = true }
stickleback = { workspace = true, optional = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# G5d: the projection carrier. `notochord` brings in the one audited
# `AcceptedSession -> SessionFacts` adapter (Notochord N1) so this port does
# not hand-build carrier facts of its own.
transport = { workspace = true, features = ["notochord"], optional = true }
# C2: the WebRTC door's core types — `InviteV1`, `LinkChallenge`, and the three
# signing-byte domains the host and browser both compute over. Default
# features only: the door is sans-I/O and wants the Wasm-clean core, not the
# `native` str0m adapter, which the dev-dependency below turns on for the
# loopback integration test alone.
zeroize = { version = "1", optional = true }

[[bin]]
name = "g1_receipt"
path = "src/bin/g1_receipt.rs"
required-features = ["native"]

[[bin]]
name = "goal-surface-host"
path = "src/bin/goal_surface_host.rs"
required-features = ["goal-surface-proof"]

[[bin]]
name = "moot-resource-host"
path = "src/bin/moot_resources_host.rs"
required-features = ["moot-resource-proof"]

[[bin]]
name = "personae-vault"
path = "src/bin/personae_vault.rs"
required-features = ["native"]

[[bin]]
name = "g4_sessions"
path = "src/bin/g4_sessions.rs"
required-features = ["native"]

[[bin]]
name = "g5_peer"
path = "src/bin/g5_peer/main.rs"
required-features = ["native"]

[[bin]]
name = "h6_transfer_peer"
path = "src/bin/h6_transfer_peer/main.rs"
required-features = ["native", "web"]

[[bin]]
name = "h7_sync_peer"
path = "src/bin/h7_sync_peer.rs"
required-features = ["personal-sync"]

[[bin]]
name = "n4_policy_receipt"
path = "src/bin/n4_policy_receipt.rs"
required-features = ["native"]

[[bin]]
name = "receipt_ingest"
path = "src/bin/receipt_ingest.rs"
# Needs the personal-graph event vocabulary and muniment's redb backend, both
# of which arrive with personal-sync.
required-features = ["personal-sync"]
[dev-dependencies]
chacha20poly1305 = "=0.10.1"
scenograph = { workspace = true, features = ["editor"] }
# The real Rhai request batch is received by the same viewer adapter as Mandrake.
script-rhai = { workspace = true }
# Tests and examples bind throwaway identities (vault lock plan, ruling 96).
transport = { workspace = true, features = ["test-identity"] }
# Co-op tests sign as an in-memory owner (stack-lift D4: tests only).
graphshell-host = { version = "0.0.2", path = "../../crates/graphshell/graphshell-host", default-features = false, features = ["test-signer"] }
# The native accessibility receipt (dynamics grammar plan, F67): the canvas's
# producer semantics through cambium-winit-a11y's AccessKit lowering, driven
# by the headless harness, its view built with Cambium, the tree read in
# AccessKit's own types.
cambium = { workspace = true }
# W1's integration receipt drives the actual Distillery Chronicle endpoint.
# Distillery depends on Mere's substrate, not Graphshell, so this test-only
# edge does not enter the product dependency graph.
distillery.workspace = true
mesh.workspace = true
# The C0 acceptance fixture derives its shared link the way the real carrier
# does rather than pasting a constant, so a change to the transcript encoding
# fails that test too. C2 adds the `native` feature on top: the door's own
# integration test drives a real str0m loopback so the link challenge binds
# fingerprints from a DTLS handshake that actually ran, not fabricated ones.
webrtc-carrier = { workspace = true, features = ["native"] }
pollster = "0.4"
tempfile = "3"
# `process` is the C4a signaling receipt: it spawns the fixture *binary* and
# reads its stdout, because "the pieces compose in-process" and "the binary a
# headed run launches works" are different claims.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "time",
] }

# These fixtures lower into the native AccessKit host, not the browser mirror.
# Cargo's browser cone includes dev dependencies, so keep this lane scoped.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Raw facet-store access for tests that build a graph checked open would refuse.
kernel = { workspace = true, features = ["fixtures"] }
muniment = { workspace = true, features = ["redb"] }
servitor.workspace = true
proofs.workspace = true
mien.workspace = true
genet-scripted-dom.workspace = true
layout_dom_api.workspace = true
accesskit.workspace = true
cambium-desktop = { workspace = true }
cambium-a11y = { workspace = true }

[[bin]]
name = "c4_webrtc_host"
path = "src/bin/c4_webrtc_host.rs"
required-features = ["webrtc-session"]
[[bin]]
name = "h4f_agent_probe"
path = "src/bin/h4f_agent_probe.rs"
required-features = ["native"]

# The browser build's entropy: the same-named entry merges its feature into
# the one above, the way `personae` does it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

# The committed N4 receipt against `graphshell_host::policy_projection`.
[[test]]
name = "n4_owner_policy_receipt"
required-features = ["native"]

# The fixture binary driven through its own HTTP signaling: what an in-process
# composition cannot claim about the binary a headed run actually launches.
[[test]]
name = "c4_host_signaling"
required-features = ["webrtc-session"]

[[bin]]
name = "graphshell-coop"
path = "src/bin/graphshell_coop.rs"
required-features = ["coop-window"]

[lints]
workspace = true
