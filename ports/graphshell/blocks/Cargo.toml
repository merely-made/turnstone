[package]
name = "graphshell-blocks"
version = "0.0.1"
rust-version = "1.97.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native host for guest block adapters: loads a reviewed component pack into Graphshell's block pane."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
graphshell = { path = "..", default-features = false, features = ["editable-blocks", "applets"] }
block-host.workspace = true
vector-sheet.workspace = true
sceno.workspace = true

[dev-dependencies]
eidetic = { workspace = true, features = ["pack-signing"] }
personae.workspace = true
serde_json.workspace = true
# The headless render receipt (examples/render_view.rs).
sprigging.workspace = true
netrender = { workspace = true, features = ["vello-cpu"] }
paint_list_api.workspace = true
paint_list_render.workspace = true
png = "0.17"
