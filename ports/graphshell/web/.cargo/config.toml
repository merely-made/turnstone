# Committed, portable build configuration for this standalone web workspace
# (burn migration plan 13.44, ruling 558). Portable means no [patch], paths,
# source or include tables: `scripts/cargo_mode.py` refuses those in a tracked
# config. Machine-local redirects stay in the gitignored config.local.toml.
#
# personae's wasm32 identity stack sits on getrandom 0.3, whose `wasm_js`
# backend needs this cfg as well as the feature. With it committed, every
# build of a commit run from this directory makes the same bundle, from a
# plain shell or a script. Target-scoped, so native builds never see it.
# Do not also export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: Cargo joins
# that variable with this array, and the duplicate flag changes the bundle.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
