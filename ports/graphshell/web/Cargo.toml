[package]
rust-version = "1.97.1"
name = "graphshell-web"
version = "0.1.0"
edition = "2024"
publish = false

# Stands on its own, outside the mere workspace. The root manifest lists this
# path under `exclude`, but that entry cannot fire by itself: cargo only
# excludes a path that is not already an explicit member, and `ports/graphshell`
# directly above this one IS an explicit member, so the exclude is inert and
# cargo reports "current package believes it's in a workspace when it's not".
# This table is what actually keeps it out. Standing alone also means nothing is
# inherited: the dependency versions below are spelled out rather than taken
# from `workspace.dependencies`, and any `[patch]` the root manifest carries has
# to be restated at the bottom of this file.
[workspace]

[lib]
name = "graphshell_web"
crate-type = ["cdylib"]
path = "../src/web.rs"

# The viewer cone (mer3ly site canvas plan, Rulings 109-110): every feature is
# additive and on by default, so the default build is the full page. The viewer
# is `--no-default-features`, with or without `canvas-gpu`.
[features]
moot-resources = ["graphshell/moot-resources", "dep:moot"]
dynamics-receipt = []
default = ["product", "remote", "canvas-gpu", "image-decode", "presentation-webgpu", "presentation-webgl2"]
# Browser presentation routes. The full page carries both and Auto chooses at
# boot. The read-only viewer ships one artifact per route, chosen by
# `mount.js` before loading: `presentation-webgpu`, or `presentation-webgl2`
# with `without-classic-vello` (Classic Vello and its shaders not linked).
presentation-webgpu = ["cambium-genet-web-host/webgpu", "cambium-genet-web-host/portable"]
presentation-webgl2 = ["cambium-genet-web-host/webgl"]
without-classic-vello = ["genet-render-host/without-classic-vello"]
# What a page saves: IndexedDB, saved scenes, the tree's product mode,
# `web_product` and `web_practice`.
product = ["muniment/indexeddb", "dep:pandect", "dep:sha2", "graphshell/document-layout", "graphshell/retained-content", "graphshell/query-views", "graphshell/editable-blocks", "mere/query", "dep:mere-document-lanes", "dep:fleece", "dep:woodshed-notation"]
applets = ["graphshell/applets", "muniment/indexeddb"]
# The WebRTC door and the remote board: `web_remote`, `web_rtc_link`, the tree's
# remote board.
remote = ["graphshell/webrtc-browser", "dep:mere-overmap", "dep:mere-view", "dep:futures-channel", "dep:futures-util"]
# The canvas's repulsion on the page's own WebGPU device (physics catalog P5c).
canvas-gpu = ["graphshell/canvas-gpu", "mere/canvas-gpu"]
# Forwards genet-livery's image decoding (mer3ly Ruling 111); on by default.
image-decode = ["genet-render/image-decode", "taproot/image-decode", "cambium-rootstock/image-decode", "mesquite/image-decode", "cambium-genet-web-host/image-decode", "graphshell/image-decode", "mere/image-decode"]

[dependencies]
# Product document readings only; the read-only graph viewer has no music cone.
# Graphshell supplies the accessible label and event controls itself.
woodshed-notation = { git = "https://github.com/merely-made/woodshed.git", rev = "a0ae58f97ca962b29fcd6ae08c9e6aec35d74c61", default-features = false, optional = true }
mere-view = { path="../../../crates/cambium/mere-view", optional=true }
# The shared mere panel over the remote board's admitted route (stack lift plan L14).
mere-overmap = { path = "../../../crates/cambium/mere-overmap", optional = true }
# The saved-scene shapes the scene page reads (`pandect::saved_scene`).
pandect = { path = "../../../crates/system/pandect", optional = true }
mere-document-lanes = { path = "../../../crates/system/document-lanes", features = ["retained-clips"], optional = true }
fleece = { package = "mere-fleece", path = "../../../crates/fleece", features = ["portable-clip", "page-links"], optional = true }
eidetic = { default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
moot = { package = "mere-moot", path = "../../moot", default-features = false, features = ["presentation"], optional = true }
# `webrtc-browser` is the C4 door's peer half (`webrtc_browser`, `webrtc_join`)
# and needs `--cfg getrandom_backend="wasm_js"` in this target's rustflags:
# personae's wasm32 identity stack sits on getrandom 0.3, whose `wasm_js`
# feature is inert without the cfg. The cfg is committed in .cargo/config.toml.
graphshell = { path = "..", default-features = false, features = ["web"] }
mere = { path = "../../../crates/mere", default-features = false, features = ["graph", "canvas"] }
# `indexeddb` supplies the browser realization of muniment's byte-store seam,
# which this crate hands to `GraphshellApp` as its backend. It lived here until
# the duplicate showed up; muniment owns the backend family, so it owns this.
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
graphshell-client = { path = "../../../crates/graphshell/graphshell-client" }
workbench = { path = "../../../crates/cambium/workbench" }
sceno = { path = "../../../crates/cambium/scenes/sceno" }
scenograph = { path = "../../../crates/cambium/scenes/scenograph" }
scenomise = { path = "../../../crates/cambium/scenes/scenomise", features = ["authoring"] }
scenotime = { path = "../../../crates/cambium/scenes/scenotime" }
serde = { version = "1", features = ["derive"] }
# A mere workspace member since 2026-09-03 (platform boundary plan, P2), so a
# relative path like the other mere crates above, not a git pin.
cambium = { path = "../../../crates/cambium/cambium" }
tabard = { path = "../../../crates/system/tabard" }
# The one-tree page (`src/web_tree.rs`): Cambium's web host mounts the tree,
# and rootstock carries the host types and the canvas's texture producer.
cambium-genet-web-host = { path = "../../../crates/cambium/cambium-genet-web-host", default-features = false }
cambium-rootstock = { path = "../../../crates/cambium/cambium-rootstock", default-features = false }
mesquite = { path = "../../../crates/cambium/mesquite", default-features = false }
genet-render = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["livery", "accesskit"] }
# The present core, shared with every winit host. Booting wgpu, picking a
# non-sRGB surface format, and rasterizing a Scene are not browser-specific, so
# this crate no longer hand-rolls them; only the canvas target and the
# content-over-chrome composition below are ours.
genet-render-host = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
# Retained scenario attributes use the shared DOM seam.
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
# The shared scenario driver every genet app runs its receipts through; the
# page implements its `Automatable`/`Driveable` over the browser DOM
# (`src/web_scenario.rs`). Pure: its three deps are already in this graph.
# Named genet-probe until genet 7baa554c (2026-09-14).
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
js-sys = "0.3"
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
serde_json = "1"
# The remote link's outbound queue: the host enqueues lines synchronously,
# a task drains them onto the channel.
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
sha2 = { version = "0.11", optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "console",
    # The viewer's own wheel and touch listeners, ahead of the host's
    # (src/web_tree/gestures.rs), and its reduced-motion query.
    "AddEventListenerOptions",
    "Blob",
    # The display period's worker (src/web_period_worker.rs).
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement", "HtmlAudioElement", "HtmlMediaElement",
    "HtmlIFrameElement",
    "CssStyleDeclaration",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Headers",
    "HtmlTextAreaElement",
    "ImageData",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MediaQueryList",
    "MessageEvent",
    # `?nodes=` and `?seed=`: phase 3's generated graph (src/web_graphs.rs).
    "Location",
    "MouseEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "PointerEventInit",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "StorageManager",
    "Storage",
    "Touch",
    "TouchEvent",
    # A scenario's synthetic touches and wheel (src/web_tree/gesture_steps.rs).
    "TouchEventInit",
    "TouchInit",
    "TouchList",
    "Url",
    "UrlSearchParams",
    "WheelEvent",
    "WheelEventInit",
    "Window",
    "Worker",
] }

# Standalone manifests do not inherit Mere's root patch table, so the ones
# that matter are restated here (see the note at the top). Keep every rev in
# step with the genet pins above. Taffy is a Genet fork published under the same
# version number as the crate it replaces, so missing it is invisible while
# genet-livery resolves from crates.io and a compile error the moment it resolves
# the working copy: buckram names `genet-taffy` outright. Parley needs no row â€”
# as of genet 5ae30cad the fork is published as `genet-parley` (and its sibling
# as `genet-fontique`), so no package in genet answers to the name `parley` and
# a patch row would match nothing and fail resolution; genet-livery reaches the
# fork by path inside the git checkout.
# layout-dom-api (0.1.1) and genet-scripted-dom (0.1.2) are pinned to the same
# rev so no crates.io copy can enter the graph beside the git one. vello is the
# maintained Classic 0.11 renderer fork. These are remote revision patches, never
# local paths. The root dropped its ipc-channel row as dead on 2026-09-23, and
# so does this table.
# The release build a host ships (mer3ly site canvas plan, Ruling 157): the
# settings P0 measured the viewer cone with (`measure-release.sh`), pinned
# here so every `cargo build --release --locked` of a commit makes the same
# bundle. Receipts use the dev profile below.
[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
codegen-units = 1

# The read-only interaction tier has a separate delivery budget. Keep the
# established full-page release profile; optimize the viewer across the whole
# selected cone instead of shipping document-host capabilities it does not use.
# Build with `--profile viewer --no-default-features`.
[profile.viewer]
inherits = "release"
opt-level = "z"
lto = "fat"

# The receipts settle physics for hundreds of frames, and the dynamics stack
# at the dev profile's opt-level 0 was the slow part of every run. Optimize
# just those crates in dev builds â€” never the crates edited here, so an
# incremental host build stays fast. This manifest is its own workspace, so
# the override reaches the wasm build alone. (Physics catalog â€” the P2 profile
# item, 2026-09-04; glamx joined 2026-10-04 so the root manifest, which now
# optimizes the same physics crates in dev, names the same six.)
[profile.dev.package.rapier2d]
opt-level = 3
[profile.dev.package.parry2d]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.seiche]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3

[patch.crates-io]
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "f27bee8eb5152618ab91fa8676d62c72ebfcb4fc" }
gemot = { git = "https://github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
mien = { git = "https://github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
mooting = { git = "https://github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
# Dramatis uses published muniment; the viewer and its applets share Mere's
# own package, as the root workspace does after DR-D.
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
# Registry Webcue and Genet sessions share one input vocabulary, as at the root.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Classic 0.11 and its owned repairs, kept in step with the root Scene aliases.
# Standalone workspaces restate the complete encoding/shader trio.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
# The resident lane's CubeCL stack (mere `canvas-gpu`, physics catalog P5c),
# restated from the root manifest because [patch] is not inherited:
# cubecl-runtime 0.11.0 with persistence removed from its defaults
# (ruling 375). burn-cubecl takes the registry crate, as at the root, since
# its selector was retired under ruling 410. Delete with the root's row.
cubecl-runtime = { path = "../../../support/patches/cubecl-runtime" }

# Match the root retained/admitted owner supplier closure.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }

