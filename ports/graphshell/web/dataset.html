<!doctype html>
<html lang="en" class="full-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graphshell, host dataset</title>
    <link rel="stylesheet" href="./styles.css?h3=1">
  </head>
  <body class="full-page">
    <!-- The plain viewer on a host dataset (mer3ly site canvas plan, S1): the
         same bundle and tree as tree.html, its root naming a
         scenomise.host-dataset/v1 file by data-dataset-src. `?dataset=`
         overrides it. -->
    <graphshell-tree id="graphshell" data-owns-title data-dataset-src="fixtures/site-repository-host-dataset.json" data-ready="false"></graphshell-tree>

    <!-- The scenario lane's output, as on index.html: page-level and hidden
         from the accessibility tree. -->
    <section id="scenario-host" aria-hidden="true" hidden>
      <pre id="scenario-log"></pre>
      <pre id="scenario-result"></pre>
      <div id="scenario-captures"></div>
    </section>

    <script type="module" src="./loader.js"></script>
  </body>
</html>
