# cargo-deny configuration for ports/graphshell/web, which is its own workspace.
# The rule and how a skip is argued are in the root deny.toml.
#
# The graph is the wasm32 one: the crate is `#![cfg(target_arch = "wasm32")]`
# and is only built with `--target wasm32-unknown-unknown`
# (scripts/build-viewer.py), so a native-only duplicate never ships here.

[graph]
all-features = true
targets = [{ triple = "wasm32-unknown-unknown" }]

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.skip]]
crate = "bit-set@0.8.0"
reason = "lalrpop 0.22.2 (lalrpop 0.23.2 drops it) requires it, under netrender-wesl; goes when their dependents take lalrpop 0.23.2"

[[bans.skip]]
crate = "bit-vec@0.8.0"
reason = "lalrpop 0.22.2 (lalrpop 0.23.2 drops it) requires it, via bit-set 0.8.0, under netrender-wesl; goes when their dependents take lalrpop 0.23.2"

