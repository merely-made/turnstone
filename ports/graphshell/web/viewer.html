<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graphshell viewer</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #070c0f; color: #dce3e8; }
      p { margin: 16px; max-width: 60ch; }
      graphshell-tree { display: block; height: 720px; }
    </style>
  </head>
  <body>
    <!-- The plain viewer as a host page mounts it (mer3ly site canvas plan,
         Rulings 121, 124 and 157): `viewer.js`, with no scenario lane or
         receipt harness, and a host history named by data-dataset-src
         (`?dataset=` overrides it). The wheel zooms the graph by default.
         Graph commands can choose wheel pan or page scroll; hosts can set
         data-wheel-mode="page" or ?wheel=page. Ctrl/Meta always zooms. -->
    <p>The site's published repository history, one checkpoint at a time.</p>
    <graphshell-tree data-dataset-src="fixtures/site-repository-host-history.json"></graphshell-tree>
    <p>The page continues below the viewer.</p>
    <div style="height: 600px"></div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
