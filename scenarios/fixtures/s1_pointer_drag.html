<!doctype html>
<meta charset="utf-8">
<title>s1-ready</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    box-sizing: border-box;
    padding: 32px;
    color: #f4f7ff;
    background: #162033;
    font: 24px/1.4 system-ui, sans-serif;
  }
  #drop { margin-top: 24px; padding: 32px; border: 3px dashed #86b7ff; }
  #source {
    position: absolute;
    left: 64px;
    top: 330px;
    color: #b9d4ff;
  }
</style>
<body>
  <strong>Pointer Events + DataTransfer receipt</strong>
  <div id="drop">Drop a file anywhere on this page</div>
  <a id="source" href="https://example.com/turnstone-s1" draggable="true">Drag this link</a>
<script>
  const contacts = new Set();
  addEventListener("pointerdown", event => {
    contacts.add(event.pointerId);
    document.title = `touches:${contacts.size};type:${event.pointerType};primary:${event.isPrimary};pressure:${event.pressure}`;
  });
  for (const name of ["pointerup", "pointercancel"]) {
    addEventListener(name, event => contacts.delete(event.pointerId));
  }
  document.querySelector("#source").addEventListener("dragstart", event => {
    event.dataTransfer.effectAllowed = "copyLink";
    event.dataTransfer.setData("text/plain", "Turnstone page drag");
    event.dataTransfer.setData("text/html", "<b>Turnstone page drag</b>");
    event.dataTransfer.setData("text/uri-list", location.href);
  });
  addEventListener("dragenter", () => document.title = "host-drag:enter");
  addEventListener("dragover", event => {
    event.preventDefault();
    document.title = "host-drag:over";
  });
  addEventListener("drop", event => {
    event.preventDefault();
    const file = event.dataTransfer.files[0];
    document.title = file
      ? `drop:files:${event.dataTransfer.files.length};name:${file.name};type:${file.type || "empty"}`
      : `drop:strings:${event.dataTransfer.types.join(",")}`;
  });
</script>
</body>
