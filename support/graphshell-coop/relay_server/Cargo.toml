[package]
name = "graphshell-coop-relay-receipt"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
iroh-relay = { version = "=1.4.1", features = ["server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
