# cargo-deny configuration for support/graphshell-coop/relay_server, which is its own workspace.
# The rule and how a skip is argued are in the root deny.toml.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.skip]]
crate = "base64@0.22.1"
reason = "tokio-rustls-acme 0.9.1 (latest), tokio-websockets 0.13.3 (latest) require it, via pem 3.0.6, under graphshell-coop-relay-receipt; goes when tokio-rustls-acme, tokio-websockets move to base64 0.23.1"

